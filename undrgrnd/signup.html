<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign up — UNDRGRND</title>
<style>
  :root{--text:#f5f5f7;--muted:#9a9aa5;--line:rgba(255,255,255,.12);--accent:#ff3b3b}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Space Grotesk",Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#0a0a0c,#050506);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  a{color:var(--accent)}
  .box{width:100%;max-width:360px}
  h1{font-size:22px;margin:0 0 20px}
  input{width:100%;padding:11px 12px;margin-bottom:10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit}
  button{width:100%;padding:11px;border-radius:8px;border:0;background:var(--accent);color:#0a0a0c;font-weight:700;font:inherit;cursor:pointer;margin-top:4px}
  .msg{font-size:13px;margin-bottom:14px}
  .msg.err{color:#ff8a8a}
  .foot{margin-top:16px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="box">
  <h1><a href="./" style="color:inherit;text-decoration:none">UNDR<span style="color:var(--accent)">GRND</span></a></h1>
  <div id="msg"></div>
  <form id="form">
    <input name="username" type="text" placeholder="Username" required />
    <input name="email" type="email" placeholder="Email" required />
    <input name="password" type="password" placeholder="Password" minlength="6" required />
    <button type="submit">Sign up</button>
  </form>
  <p class="foot">Already have an account? <a href="./login.html">Sign in</a></p>
</div>
<script type="module">
  import { supabase } from "./shared.js";
  const msgEl = document.getElementById("msg");

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const { error } = await supabase.auth.signUp({
      email: fd.get("email"),
      password: fd.get("password"),
      options: { data: { username: fd.get("username") } },
    });
    if (error) {
      msgEl.innerHTML = `<p class="msg err"></p>`;
      msgEl.querySelector(".msg").textContent = error.message;
      return;
    }
    location.href = "./login.html?message=" + encodeURIComponent("Check your email to confirm your account, then sign in.");
  });
</script>
</body>
</html>
