<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — UNDRGRND</title>
<style>
  :root{--panel:rgba(255,255,255,.04);--text:#f5f5f7;--muted:#9a9aa5;--line:rgba(255,255,255,.12);--accent:#ff3b3b}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Space Grotesk",Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#0a0a0c,#050506);color:var(--text);min-height:100vh}
  a{color:var(--accent);text-decoration:none}
  .navwrap{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
  .brand{font-weight:900;font-size:19px;color:var(--text)}
  .brand span{color:var(--accent)}
  .navlinks{display:flex;align-items:center;gap:16px;font-size:14px}
  .navlinks a{color:var(--muted)}
  .navlinks a.on,.navlinks a:hover{color:var(--text)}
  .linklike{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:0}
  main{max-width:760px;margin:0 auto;padding:32px 20px}
  h1{font-size:20px;margin:0 0 14px}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:36px 0 14px}
  input,textarea,select{width:100%;padding:9px 10px;margin-bottom:8px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:13px}
  button{padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--text);font:inherit;font-size:13px;cursor:pointer}
  button.primary{background:var(--accent);color:#0a0a0c;font-weight:700;border:0}
  .card{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;background:var(--panel)}
  .card .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
  .card .status{font-size:12px;color:var(--muted)}
  .card ul{margin:0 0 12px;padding-left:18px;font-size:13px;color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .empty{color:var(--muted);padding:20px 0;text-align:center}
</style>
</head>
<body>
<header id="nav"></header>
<main id="main">
  <p class="empty">Checking access…</p>
</main>
<script type="module">
  import { supabase, renderNav, escapeHtml } from "./shared.js";

  const nav = document.getElementById("nav");
  const main = document.getElementById("main");
  const { user, isCurator } = await renderNav(nav, "admin");

  if (!user) {
    location.href = "./login.html";
  } else if (!isCurator) {
    main.innerHTML = `<p class="empty">Curators only.</p>`;
  } else {
    await render();
  }

  async function render() {
    const { data: drops } = await supabase
      .from("drops")
      .select("id, title, description, published_at, drop_tracks(tracks(id, title, artist))")
      .order("created_at", { ascending: false });

    main.innerHTML = `
      <h1>New drop</h1>
      <form id="newDrop" class="card">
        <input name="title" placeholder="Drop title" required />
        <textarea name="description" placeholder="Description (optional)" rows="2"></textarea>
        <button type="submit" class="primary">Create drop</button>
      </form>

      <h2>Drops</h2>
      ${
        (drops || []).length === 0
          ? '<p class="empty">No drops yet.</p>'
          : (drops || [])
              .map(
                (drop) => `
        <div class="card" data-drop-id="${drop.id}">
          <div class="head">
            <div>
              <strong>${escapeHtml(drop.title)}</strong>
              <div class="status">${drop.published_at ? "Published " + new Date(drop.published_at).toLocaleDateString() : "Draft"}</div>
            </div>
            ${!drop.published_at ? `<button class="publish-btn" data-id="${drop.id}">Publish</button>` : ""}
          </div>
          <ul>
            ${(drop.drop_tracks || []).map((dt) => `<li>${escapeHtml(dt.tracks?.title)} — ${escapeHtml(dt.tracks?.artist)}</li>`).join("") || "<li>No tracks yet</li>"}
          </ul>
          <form class="add-track grid2" data-drop-id="${drop.id}">
            <input name="title" placeholder="Track title" required />
            <input name="artist" placeholder="Artist" required />
            <select name="source">
              <option value="soundcloud">SoundCloud</option>
              <option value="youtube">YouTube</option>
              <option value="bandcamp">Bandcamp</option>
              <option value="other">Other</option>
            </select>
            <input name="embed_url" placeholder="Embed/track URL" required />
            <input name="external_url" placeholder="External link (optional)" style="grid-column:1 / -1" />
            <button type="submit" style="grid-column:1 / -1">Add track</button>
          </form>
        </div>
      `
              )
              .join("")
      }
    `;

    document.getElementById("newDrop").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      await supabase.from("drops").insert({
        title: fd.get("title"),
        description: fd.get("description") || null,
        curator_id: user.id,
      });
      await render();
    });

    main.querySelectorAll(".publish-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        await supabase.from("drops").update({ published_at: new Date().toISOString() }).eq("id", btn.dataset.id);
        await render();
      });
    });

    main.querySelectorAll(".add-track").forEach((form) => {
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const dropId = form.dataset.dropId;
        const { data: track, error } = await supabase
          .from("tracks")
          .insert({
            title: fd.get("title"),
            artist: fd.get("artist"),
            source: fd.get("source"),
            embed_url: fd.get("embed_url"),
            external_url: fd.get("external_url") || null,
          })
          .select("id")
          .single();

        if (!error && track) {
          const { count } = await supabase
            .from("drop_tracks")
            .select("*", { count: "exact", head: true })
            .eq("drop_id", dropId);
          await supabase.from("drop_tracks").insert({ drop_id: dropId, track_id: track.id, position: count || 0 });
        }
        await render();
      });
    });
  }
</script>
</body>
</html>
