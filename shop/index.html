<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loop Site</title>
<meta name="description" content="Book an appointment, see prices and hours, and join the rewards card." />
<meta name="theme-color" content="#111014" />
<link rel="preconnect" href="https://qgbjiqdwzgkjkmqyjsmc.supabase.co" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23111014'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' dominant-baseline='middle' font-size='30'%3E%F0%9F%92%88%3C/text%3E%3C/svg%3E" />
<style>
  /* ── Four themes, one template. Every theme sets the same eight tokens, so a
       new look is a token block and nothing else. A shop can override --acc
       alone with its own colour without touching the rest. ──────────────── */
  :root,[data-theme="classic"]{
    --bg:#f6f1e7; --bg2:#efe7d8; --ink:#17161a; --muted:#6a6558;
    --card:#fffdf8; --line:rgba(23,22,26,.14);
    --acc:#8c1d1d; --acc-ink:#fff; --hero:#17161a; --hero-ink:#f6f1e7;
  }
  /* star gold is deliberately NOT the accent: five stars in the shop's brand
     colour read as decoration, in gold they read as a rating */
  :root{--gold:#f0b100}
  [data-theme="fade"]{
    --bg:#0c0e13; --bg2:#11141b; --ink:#eef1f7; --muted:#98a0b2;
    --card:rgba(255,255,255,.045); --line:rgba(150,190,255,.18);
    --acc:#5df2e0; --acc-ink:#05070f; --hero:#05070f; --hero-ink:#eef1f7;
  }
  [data-theme="luxe"]{
    --bg:#0a0a0a; --bg2:#111; --ink:#f4efe4; --muted:#9d9484;
    --card:rgba(255,255,255,.04); --line:rgba(212,175,55,.26);
    --acc:#d4af37; --acc-ink:#0a0a0a; --hero:#000; --hero-ink:#f4efe4;
  }
  [data-theme="bold"]{
    --bg:#ffffff; --bg2:#f3f4f6; --ink:#101114; --muted:#5f6472;
    --card:#fff; --line:rgba(16,17,20,.12);
    --acc:#e11d48; --acc-ink:#fff; --hero:#101114; --hero-ink:#fff;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.6;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif}
  img{max-width:100%;display:block}
  a{color:inherit}
  .wrap{max-width:620px;margin:0 auto;padding:0 16px}
  /* room for the sticky bar so the footer is never trapped under it */
  .pad{height:86px}

  /* ── hero ─────────────────────────────────────────────────────────────
     With no photo the header still has to look designed rather than blank,
     so it gets a barber-pole stripe in the shop's own accent. */
  .hero{background:var(--hero);color:var(--hero-ink);position:relative;overflow:hidden}
  .hero .inner{padding:32px 0 28px;position:relative;z-index:1}
  .hero.plain::before{content:'';position:absolute;inset:0;opacity:.14;
    background:repeating-linear-gradient(135deg,var(--acc) 0 14px,transparent 14px 40px)}
  .heropic{position:relative}
  .heropic img{width:100%;height:250px;object-fit:cover;opacity:.92}
  .heropic .over{position:absolute;inset:0;display:flex;align-items:flex-end;
    background:linear-gradient(180deg,rgba(0,0,0,.12) 30%,rgba(0,0,0,.86))}
  .heropic .over .wrap{width:100%}
  .heropic .inner{padding-bottom:20px}
  .heropic h1,.heropic .tag{text-shadow:0 1px 14px rgba(0,0,0,.5)}
  .logo{width:70px;height:70px;border-radius:16px;object-fit:cover;margin-bottom:12px;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22)}
  /* no logo yet: a monogram badge, so the header still opens with a mark */
  .mono{width:62px;height:62px;border-radius:16px;margin-bottom:12px;display:flex;
    align-items:center;justify-content:center;font-weight:900;font-size:24px;letter-spacing:.5px;
    background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 55%,var(--hero)),color-mix(in srgb,var(--acc) 22%,var(--hero)));
    border:1px solid rgba(255,255,255,.22);color:#fff}
  .hbar{width:42px;height:4px;border-radius:2px;background:var(--acc);margin:12px 0 0}
  h1{font-size:30px;line-height:1.16;margin:0 0 6px;letter-spacing:-.5px;font-weight:900}
  .tag{color:var(--hero-ink);opacity:.78;margin:0;font-size:15px}
  .badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
  .pill{font-size:12.5px;font-weight:800;border-radius:999px;padding:5px 12px;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2)}
  .pill.open{background:#16a34a;border-color:transparent;color:#fff}
  .pill.stars{background:rgba(255,255,255,.14)}

  /* ── the funnel: one tall stack of taps, thumb-height, no hunting ───── */
  .acts{display:grid;gap:10px;margin:18px 0 4px}
  .act{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:800;font-size:16px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;color:var(--ink)}
  /* real drawn icons in a tinted plate — emoji glyphs at this size look like a
     default, and the plate gives every row the same visual weight */
  .act .ico{flex:0 0 40px;width:40px;height:40px;border-radius:12px;display:flex;
    align-items:center;justify-content:center;
    background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc)}
  .act .ico svg{width:19px;height:19px}
  .act .sub{display:block;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:1px}
  .act .arw{margin-left:auto;color:var(--muted);font-weight:700}
  .act.primary{background:var(--acc);border-color:transparent;color:var(--acc-ink)}
  .act.primary .sub{color:var(--acc-ink);opacity:.82}
  .act.primary .arw{color:var(--acc-ink)}
  .act.primary .ico{background:color-mix(in srgb,var(--acc-ink) 18%,transparent);color:var(--acc-ink)}
  .act{transition:transform .12s ease,filter .12s ease}
  .act:active{transform:scale(.98);filter:brightness(.97)}

  section{padding:26px 0 4px}
  h2{font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
    margin:0 0 12px;font-weight:800}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .row{display:flex;justify-content:space-between;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .nm{font-weight:700}
  .row .mn{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
  .row .pr{font-weight:800;white-space:nowrap}
  /* prices are the information — they get the size, not the labels */
  .svc .row .pr{font-weight:900;font-size:17.5px}
  .row.today{background:color-mix(in srgb,var(--acc) 10%,transparent)}
  .row.today .nm{color:var(--acc)}
  .pop{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;
    background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);
    border-radius:999px;padding:2.5px 9px;margin-left:8px;vertical-align:2px}

  .about{color:var(--muted);font-size:15px;margin:0}
  .team{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}

  /* ── the chairs ───────────────────────────────────────────────────────
     A barbershop is three or four personal businesses sharing a room, so
     each barber gets a card with his own face and his own book button. */
  .crew{display:grid;gap:10px}
  .bb{display:flex;gap:13px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:13px 14px}
  .bb .av{width:54px;height:54px;flex:0 0 54px;border-radius:50%;object-fit:cover;
    background:color-mix(in srgb,var(--acc) 15%,transparent);display:flex;align-items:center;
    justify-content:center;font-weight:900;font-size:20px;color:var(--acc)}
  .bb .who{flex:1;min-width:0}
  .bb .who b{display:block;font-size:16px}
  .bb .who span{display:block;color:var(--muted);font-size:13px;margin-top:1px}
  .bb .go{flex:0 0 auto;display:flex;gap:7px;align-items:center}
  .bb .go a{display:flex;align-items:center;justify-content:center;text-decoration:none;
    font-weight:800;font-size:13px;border-radius:999px;padding:9px 14px;
    background:var(--acc);color:var(--acc-ink);white-space:nowrap}
  .bb .go a.ic2{background:transparent;border:1px solid var(--line);color:var(--ink);padding:8px 10px}
  .bb .go svg{width:16px;height:16px}
  @media(max-width:420px){
    .bb{flex-wrap:wrap}
    .bb .go{width:100%;margin-top:2px}
    .bb .go a{flex:1}
  }

  /* ── good to know: the practical answers, as tags not paragraphs ────── */
  .know{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
  .know .kr{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
  .know .kr:first-child{border-top:0;padding-top:0}
  .know .kr .ki{flex:0 0 20px;color:var(--acc);margin-top:1px}
  .know .kr .ki svg{width:18px;height:18px}
  .know .kr .kt{flex:1;font-size:14.5px}
  .know .kr .kt b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:3px}
  .paytags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .paytags span{font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:4px 11px}

  .gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .gal>*{border-radius:12px;height:150px;width:100%;background:var(--bg2);overflow:hidden}
  .gal img{object-fit:cover;height:150px}
  .gal>*:first-child:nth-last-child(odd){grid-column:span 2;height:190px}
  /* stand-in art for a shop that has not uploaded photos yet: line drawings in
     the shop's own accent, so the page reads as designed instead of unfinished.
     One real photo and every placeholder disappears. */
  .ph{display:flex;align-items:center;justify-content:center;color:var(--acc);
    border:1px solid var(--line);background:
      linear-gradient(160deg,color-mix(in srgb,var(--acc) 9%,transparent),transparent 70%),var(--card)}
  .ph svg{width:52%;height:52%;opacity:.62}

  .rev{display:grid;gap:10px}
  .rq{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .rhead{display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .av{width:37px;height:37px;flex:0 0 37px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-weight:900;font-size:15px;
    background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
  .rq .who{font-weight:800;font-size:13.5px}
  .rq .st{color:var(--gold);font-size:12px;letter-spacing:2.5px;margin-top:1px}
  .rq p{margin:0;font-size:14.5px}

  .perk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 16px 18px;text-align:center}
  .perk .pico{width:46px;height:46px;margin:0 auto 10px;border-radius:13px;display:flex;
    align-items:center;justify-content:center;
    background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc)}
  .perk .pico svg{width:22px;height:22px}
  .perk .gst{color:var(--gold);font-size:17px;letter-spacing:4px;margin-bottom:6px}
  .perk .big{font-size:19px;font-weight:900;margin:2px 0 4px}
  .perk p{color:var(--muted);font-size:14px;margin:0 0 14px}
  .btn{display:inline-block;background:var(--acc);color:var(--acc-ink);text-decoration:none;
    font-weight:800;border-radius:12px;padding:13px 22px;font-size:15px;
    transition:transform .12s ease,filter .12s ease}
  .btn:active{transform:scale(.97);filter:brightness(.96)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

  footer{margin-top:30px;padding:24px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
  footer b{color:var(--ink)}
  footer a{color:var(--muted)}
  .powered{margin-top:16px;font-size:12px;opacity:.75}

  /* ── sticky book bar ──────────────────────────────────────────────────
     The single biggest lift on a page like this: booking is never more than
     one tap away, no matter how far down they have scrolled. Hidden until
     the hero's own book button has gone off screen, so it never doubles up. */
  .stick{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);display:flex;gap:9px;
    transform:translateY(120%);transition:transform .22s ease}
  .stick.show{transform:none}
  .stick a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    text-decoration:none;font-weight:800;font-size:15.5px;
    border-radius:12px;padding:14px 10px;background:var(--acc);color:var(--acc-ink);
    box-shadow:0 4px 16px color-mix(in srgb,var(--acc) 35%,transparent);
    transition:transform .12s ease}
  .stick a:active{transform:scale(.97)}
  .stick a svg{width:18px;height:18px}
  .stick a.sec{flex:0 0 56px;background:transparent;color:var(--ink);border:1px solid var(--line);
    box-shadow:none;padding:12px 0}

  /* ── the shop's music ─────────────────────────────────────────────────
     Never autoplays. Browsers block it anyway, and a page that starts
     making noise in a quiet room is a page somebody closes. It sits above
     the book bar so it can never cover the thing that earns money. */
  .music{position:fixed;left:16px;z-index:19;bottom:calc(16px + env(safe-area-inset-bottom));
    transition:bottom .22s ease}
  .music.up{bottom:calc(86px + env(safe-area-inset-bottom))}
  .mbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);
    color:var(--ink);font:inherit;font-weight:800;font-size:13.5px;padding:10px 15px;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.22)}
  .mbtn .eq{display:flex;align-items:flex-end;gap:2px;height:13px}
  .mbtn .eq i{width:3px;height:4px;border-radius:1px;background:var(--acc);display:block}
  .music.on .mbtn .eq i{animation:eq .9s ease-in-out infinite}
  .music.on .mbtn .eq i:nth-child(2){animation-delay:.15s}
  .music.on .mbtn .eq i:nth-child(3){animation-delay:.3s}
  @keyframes eq{0%,100%{height:4px}50%{height:13px}}
  .mlist{position:absolute;bottom:calc(100% + 8px);left:0;min-width:210px;max-width:78vw;
    background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:0 14px 40px rgba(0,0,0,.35)}
  .mlist button{display:block;width:100%;text-align:left;background:transparent;border:0;
    border-bottom:1px solid var(--line);color:var(--ink);font:inherit;font-size:14px;font-weight:600;
    padding:11px 14px;cursor:pointer}
  .mlist button:last-child{border-bottom:0}
  .mlist button.cur{color:var(--acc);font-weight:800}
  .mlist.hide{display:none}
  @media(prefers-reduced-motion:reduce){ .music{transition:none} .music.on .mbtn .eq i{animation:none} }

  .state{max-width:520px;margin:0 auto;padding:70px 22px;text-align:center}
  .state .em{font-size:44px}
  .state h1{font-size:22px;margin:12px 0 8px}
  .state p{color:var(--muted);margin:0}

  /* ── loading skeleton ─────────────────────────────────────────────────
     The page is fetch-then-render; without this it is a blank screen for as
     long as the RPC takes. The skeleton has the same bones as the real page,
     so the swap reads as the page sharpening, not appearing. */
  .skel .skhero{height:200px;background:var(--hero);border-radius:0}
  .sk{position:relative;overflow:hidden;border-radius:14px;background:var(--bg2)}
  .sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 7%,transparent),transparent);
    animation:shim 1.3s infinite}
  @keyframes shim{to{transform:translateX(100%)}}
  .skact{height:62px;margin:10px 0}
  .skel .wrap .skact:first-child{margin-top:18px}
  .skline{height:13px;width:38%;margin:26px 0 12px}
  .skcard{height:168px}

  @media(min-width:560px){ h1{font-size:36px} .heropic img{height:300px} }
  @media(prefers-reduced-motion:reduce){
    .stick,.act,.btn,.stick a{transition:none}
    .act:active,.btn:active,.stick a:active{transform:none}
    .sk::after{animation:none}
  }
</style>
</head>

    pin: IC_.o+'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'+IC_.c,
    ig: IC_.o+'<rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>'+IC_.c,
    tiktok: IC_.o+'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'+IC_.c,
    link: IC_.o+'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>'+IC_.c,
    gift: IC_.o+'<polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>'+IC_.c,
    car: IC_.o+'<path d="M5 17H3v-5l2-5h14l2 5v5h-2"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/><path d="M5 12h14"/>'+IC_.c,
    card: IC_.o+'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>'+IC_.c,
    info: IC_.o+'<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>'+IC_.c
  };
  /* what each walk-in setting says in the hero, in the customer's words */
  var WALKIN={ welcome:'Walk-ins welcome', appointment:'By appointment', call:'Call ahead' };
  var PAYLBL={ card:'Card', cash:'Cash', applepay:'Apple Pay', venmo:'Venmo',
               cashapp:'Cash App', zelle:'Zelle' };
  function ico(n){ return '<span class="ico" aria-hidden="true">'+ICO[n]+'</span>'; }

  /* Everything below renders into innerHTML, so nothing reaches the page
     unescaped. esc() covers text and quoted attributes; url() is a second
     line of defence behind site_sanitize() — a stored javascript: that
     somehow predates the sanitiser still must not become a live href. */
  function esc(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function url(u){ u=String(u==null?'':u).trim(); return /^https?:\/\//i.test(u)?esc(u):''; }
  function tel(p){ return String(p==null?'':p).replace(/[^0-9+]/g,''); }
  function hex(h){ return /^#[0-9A-Fa-f]{6}$/.test(String(h||'')) ? String(h) : ''; }

  function state(em,title,msg){
    app.innerHTML='<div class="state"><div class="em">'+em+'</div><h1>'+esc(title)+'</h1><p>'+esc(msg)+'</p></div>';
  }

  if(!slug){ state('💈','No shop selected','This link is missing its shop code.'); return; }

  /* Preview mode. The owner's editor holds a payload the public RPC will not
     hand out (the site is not published yet), so it posts that payload in
     rather than us re-implementing the whole page inside the editor — one
     renderer, no drift. Same-origin only, and only when the URL opted in. */
  if(location.hash==='#preview'){
    state('👁','Preview','Waiting for the editor…');
    window.addEventListener('message',function(ev){
      if(ev.origin!==location.origin) return;
      var m=ev.data;
      if(!m||m.tbShopPreview!==true||!m.data) return;
      try{ render(m.data); }catch(e){ state('⚠️','Preview failed',String(e&&e.message||e)); }
    });
    if(window.parent&&window.parent!==window) window.parent.postMessage({tbShopPreviewReady:true},location.origin);
    return;
  }

  fetch(SUPA_URL+'/rest/v1/rpc/shop_site',{
    method:'POST',
    headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_client:slug})
  })
  .then(function(r){ return r.ok?r.json():null; })
  .then(function(d){
    if(!d||d.error){ state('💈','Shop not found','Check the link and try again.'); return; }
    if(!d.published){
      document.title=(d.biz_name||'Shop');
      state('🚧',(d.biz_name||'This shop')+' — coming soon','The website for this shop is not published yet.');
      return;
    }
    render(d);
  })
  .catch(function(){ state('📵','Could not load','Check your connection and refresh.'); });

  /* ── hours ─────────────────────────────────────────────────────────────
     hours is {"0".."6":["HH:MM","HH:MM"]} keyed by JS day number, and the
     shop's timezone is authoritative — a customer browsing from another
     timezone must still see the SHOP as open or closed, so "now" is read
     back out of Intl rather than off the local clock. */
  function shopNow(tz){
    var f;
    try{
      f=new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short',hour:'2-digit',
        minute:'2-digit',hour12:false});
    }catch(e){
      f=new Intl.DateTimeFormat('en-US',{weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false});
    }
    var parts={}; f.formatToParts(new Date()).forEach(function(p){ parts[p.type]=p.value; });
    var wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(parts.weekday);
    // '24' is how some engines render midnight in hour12:false
    var hh=parseInt(parts.hour,10); if(hh===24) hh=0;
    return { day:(wd<0?new Date().getDay():wd), mins:hh*60+parseInt(parts.minute,10) };
  }
  function toMins(hm){
    var m=/^(\d{1,2}):(\d{2})$/.exec(String(hm||'')); if(!m) return null;
    return parseInt(m[1],10)*60+parseInt(m[2],10);
  }
  function pretty(hm){
    var t=toMins(hm); if(t===null) return '';
    var h=Math.floor(t/60), mn=t%60, ap=h<12?'AM':'PM', h12=h%12; if(h12===0) h12=12;
    return h12+(mn?':'+String(mn).padStart(2,'0'):'')+' '+ap;
  }
  function isOpen(hours,tz){
    var n=shopNow(tz), t=hours&&hours[String(n.day)];
    if(!t||!t.length) return {open:false,day:n.day};
    var a=toMins(t[0]), b=toMins(t[1]);
    if(a===null||b===null) return {open:false,day:n.day};
    // a close time earlier than the open time means it runs past midnight
    var open = b>a ? (n.mins>=a&&n.mins<b) : (n.mins>=a||n.mins<b);
    return {open:open,day:n.day,close:t[1]};
  }
  /* "Closed right now" tells a customer nothing they can act on. "Opens
     tomorrow at 9 AM" answers the question they actually have. */
  function nextOpen(hours,tz){
    var n=shopNow(tz);
    for(var k=0;k<7;k++){
      var d2=(n.day+k)%7, t=hours&&hours[String(d2)];
      if(!t||!t.length) continue;
      var a=toMins(t[0]); if(a===null) continue;
      if(k===0&&n.mins>=a) continue;      // today's opening already passed
      var when = k===0?'today':(k===1?'tomorrow':DAYS[d2]);
      return 'Opens '+when+' at '+pretty(t[0]);
    }
    return '';
  }
  function stars(n){
    var r=Math.round(Number(n)||0), s='';
    for(var i=0;i<5;i++) s+= i<r ? '★' : '☆';
    return s;
  }

  function render(d){
    var s=d.site||{}, name=d.biz_name||'', tz=d.tz||'America/New_York';
    var root=document.documentElement;
    root.setAttribute('data-theme', s.theme||'classic');
    // the shop's own colour, if it set one, overrides only the accent token
    var acc=hex(s.accent);
    if(acc){
      root.style.setProperty('--acc',acc);
      // keep label text readable on whatever they picked
      var r=parseInt(acc.substr(1,2),16), g=parseInt(acc.substr(3,2),16), b2=parseInt(acc.substr(5,2),16);
      root.style.setProperty('--acc-ink',(r*299+g*587+b2*114)/1000 > 150 ? '#101114' : '#ffffff');
    } else {
      root.style.removeProperty('--acc'); root.style.removeProperty('--acc-ink');
    }

    document.title=name+(s.tagline?' — '+s.tagline:' — Book online');
    var md=document.querySelector('meta[name=description]');
    if(md) md.setAttribute('content',
      (s.about||s.tagline||('Book an appointment at '+name+'.')).slice(0,155));

    /* Where "Book" goes. A shop already on Booksy/Square keeps its own link —
       fighting that loses the sale. Otherwise the loyalty card IS the booking
       page, which is the whole point: the website feeds Loop. */
    var bookHref = d.book_url
      ? (/^https?:\/\//i.test(String(d.book_url).trim()) ? String(d.book_url).trim() : 'https://'+String(d.book_url).trim())
      : (d.booking_on ? '/rewards/?c='+encodeURIComponent(d.client) : '');
    var bookExt = !!d.book_url;

    var ph=tel(d.phone);
    var maps = s.maps || (d.address ? 'https://www.google.com/maps/search/?api=1&query='
      +encodeURIComponent(name+' '+d.address) : '');
    var op=isOpen(d.hours,tz);
    var hasHours=!!(d.hours&&Object.keys(d.hours).length);
    var nrev=Number(d.reviews_n||0);

    var h='';

    /* hero */
    var initials=esc(String(name).split(/\s+/).map(function(w){
      var m=w.match(/[A-Za-z0-9]/); return m?m[0]:'';
    }).join('').slice(0,2).toUpperCase());
    var heroInner='<div class="wrap"><div class="inner">'
      +(url(s.logo)?'<img class="logo" src="'+url(s.logo)+'" alt="'+esc(name)+' logo">'
                   :'<div class="mono" aria-hidden="true">'+initials+'</div>')
      +'<h1>'+esc(name)+'</h1>'
      +(s.tagline?'<p class="tag">'+esc(s.tagline)+'</p>':'')
      +'<div class="hbar" aria-hidden="true"></div>'
      +'<div class="badges">'
      +(hasHours?'<span class="pill '+(op.open?'open':'')+'">'
        +(op.open?'Open now'+(op.close?' · until '+esc(pretty(op.close)):'')
                 :(esc(nextOpen(d.hours,tz))||'Closed right now'))+'</span>':'')
      // the first question a new customer has, answered before he scrolls
      +(WALKIN[s.walkins]?'<span class="pill">'+esc(WALKIN[s.walkins])+'</span>':'')
      +(nrev?'<span class="pill stars"><span style="color:var(--gold)">'+stars(d.rating)+'</span> '+esc(d.rating)+' ('+nrev+')</span>':'')
      +'</div></div></div>';
    h += url(s.hero)
      ? '<header class="hero"><div class="heropic"><img src="'+url(s.hero)+'" alt="">'
        +'<div class="over">'+heroInner+'</div></div></header>'
      : '<header class="hero plain">'+heroInner+'</header>';

    h+='<div class="wrap">';

    /* the tap stack — this is the funnel */
    h+='<nav class="acts" aria-label="Quick actions">';
    if(bookHref){
      h+='<a class="act primary" id="bookTop" href="'+esc(bookHref)+'"'+(bookExt?' target="_blank" rel="noopener"':'')+'>'
        +ico('cal')+'<span>Book an appointment'
        +'<span class="sub">Pick your time in a few taps</span></span><span class="arw" aria-hidden="true">→</span></a>';
    }
    if(ph){
      h+='<a class="act'+(bookHref?'':' primary')+'" href="tel:'+esc(ph)+'">'
        +ico('phone')+'<span>Call the shop'
        +'<span class="sub">'+esc(d.phone)+'</span></span><span class="arw" aria-hidden="true">→</span></a>';
      // barbers and their customers run on text, not email
      if(s.sms!==false){
        h+='<a class="act" href="sms:'+esc(ph)+'">'
          +ico('chat')+'<span>Text the shop'
          +'<span class="sub">Quick question? Send a text</span></span><span class="arw" aria-hidden="true">→</span></a>';
      }
    }
    if(maps&&url(maps)){
      h+='<a class="act" href="'+url(maps)+'" target="_blank" rel="noopener">'
        +ico('pin')+'<span>Get directions'
        +(d.address?'<span class="sub">'+esc(d.address)+'</span>':'')
        +'</span><span class="arw" aria-hidden="true">→</span></a>';
    }
    if(s.ig){
      h+='<a class="act" href="https://instagram.com/'+encodeURIComponent(s.ig)+'" target="_blank" rel="noopener">'
        +ico('ig')+'<span>Instagram'
        +'<span class="sub">@'+esc(s.ig)+'</span></span><span class="arw" aria-hidden="true">→</span></a>';
    }
    if(s.tiktok){
      h+='<a class="act" href="https://tiktok.com/@'+encodeURIComponent(s.tiktok)+'" target="_blank" rel="noopener">'
        +ico('tiktok')+'<span>TikTok'
        +'<span class="sub">@'+esc(s.tiktok)+'</span></span><span class="arw" aria-hidden="true">→</span></a>';
    }
    // December is a third of some shops' year and there was nowhere to sell one
    if(url(s.gift)){
      h+='<a class="act" href="'+url(s.gift)+'" target="_blank" rel="noopener">'
        +ico('gift')+'<span>Buy a gift card'
        +'<span class="sub">Sorted in a minute</span></span><span class="arw" aria-hidden="true">→</span></a>';
    }
    // whatever else the shop sells — gift cards, product, a second location
    (Array.isArray(s.buttons)?s.buttons:[]).forEach(function(bn){
      if(!bn||!bn.label||!url(bn.url)) return;
      h+='<a class="act" href="'+url(bn.url)+'" target="_blank" rel="noopener">'
        +ico('link')+'<span>'+esc(bn.label)
        +'</span><span class="arw" aria-hidden="true">→</span></a>';
    });
    h+='</nav>';

    if(s.about) h+='<section><h2>About</h2><p class="about">'+esc(s.about)+'</p></section>';

    /* services */
    var svc=Array.isArray(d.services)?d.services:[];
    if(svc.length){
      h+='<section><h2>Services</h2><div class="card svc">';
      svc.forEach(function(x){
        h+='<div class="row"><span><span class="nm">'+esc(x&&x.name||'Service')+'</span>'
          +(x&&x.popular?'<span class="pop">Most booked</span>':'')
          +(x&&x.mins?'<span class="mn">'+esc(x.mins)+' min</span>':'')+'</span>'
          +'<span class="pr">'+esc(x&&x.price||'')+'</span></div>';
      });
      h+='</div></section>';
    }

    /* photos, or the stand-in art until there are some */
    var pics=(Array.isArray(s.photos)?s.photos:[]).map(url).filter(Boolean);
    h+='<section><h2>'+(pics.length?'Work':'Inside the shop')+'</h2><div class="gal">'
      +(pics.length
        ? pics.map(function(p){ return '<img src="'+p+'" alt="" loading="lazy">'; }).join('')
        : ART.slice(0,4).map(function(a){ return '<div class="ph">'+a+'</div>'; }).join(''))
      +'</div></section>';

    /* hours */
    if(hasHours){
      h+='<section><h2>Hours</h2><div class="card">';
      for(var i=0;i<7;i++){
        var t=d.hours[String(i)];
        h+='<div class="row'+(i===op.day?' today':'')+'"><span class="nm">'+DAYS[i]+'</span>'
          +'<span class="pr">'+(t&&t.length?esc(pretty(t[0])+' – '+pretty(t[1])):'Closed')+'</span></div>';
      }
      h+='</div></section>';
    }

    /* the chairs. Rich cards when the shop has filled its barbers in;
       otherwise fall back to the plain name chips from the booking staff
       list, so a shop that never opens the editor still shows its people. */
    var crew=(Array.isArray(s.barbers)?s.barbers:[]).filter(function(m){ return m&&m.name; });
    if(crew.length){
      h+='<section><h2>The chairs</h2><div class="crew">'
        +crew.map(function(m){
          // first letter of the NAME — strip anything tag-shaped first, or a
          // name containing markup puts that markup's letter in the circle
          var im=String(m.name).replace(/<[^>]*>/g,'').match(/[A-Za-z0-9]/);
          var ini=(im?im[0]:'•').toUpperCase();
          var bk=url(m.book) || (bookHref && !bookExt ? bookHref : '');
          return '<div class="bb">'
            +(url(m.photo)
               ? '<img class="av" src="'+url(m.photo)+'" alt="'+esc(m.name)+'" loading="lazy">'
               : '<div class="av" aria-hidden="true">'+esc(ini)+'</div>')
            +'<div class="who"><b>'+esc(m.name)+'</b>'
            +(m.blurb?'<span>'+esc(m.blurb)+'</span>':'')+'</div>'
            +'<div class="go">'
            +(m.ig?'<a class="ic2" href="https://instagram.com/'+encodeURIComponent(m.ig)
                  +'" target="_blank" rel="noopener" aria-label="'+esc(m.name)+' on Instagram">'+ICO.ig+'</a>':'')
            +(bk?'<a href="'+esc(bk)+'"'+(url(m.book)?' target="_blank" rel="noopener"':'')
                +'>Book '+esc(String(m.name).trim().split(/\s+/)[0])+'</a>':'')
            +'</div></div>';
        }).join('')
        +'</div></section>';
    } else if(Array.isArray(d.team)&&d.team.length){
      h+='<section><h2>Barbers</h2><div class="team">'
        +d.team.map(function(m){ return '<span class="chip">'+esc(m&&m.name||'')+'</span>'; }).join('')
        +'</div></section>';
    }

    /* good to know — parking, payment and the house rules. All three are
       things a customer either asks at the door or gets wrong on arrival. */
    var pays=(Array.isArray(s.pay)?s.pay:[]).filter(function(x){ return PAYLBL[x]; });
    if(pays.length||s.parking||s.policy){
      h+='<section><h2>Good to know</h2><div class="know">'
        +(s.parking?'<div class="kr"><span class="ki" aria-hidden="true">'+ICO.car+'</span>'
          +'<span class="kt"><b>Parking</b>'+esc(s.parking)+'</span></div>':'')
        +(pays.length?'<div class="kr"><span class="ki" aria-hidden="true">'+ICO.card+'</span>'
          +'<span class="kt"><b>Payment</b><span class="paytags">'
          +pays.map(function(x){ return '<span>'+esc(PAYLBL[x])+'</span>'; }).join('')
          +'</span></span></div>':'')
        +(s.policy?'<div class="kr"><span class="ki" aria-hidden="true">'+ICO.info+'</span>'
          +'<span class="kt"><b>Before you come</b>'+esc(s.policy)+'</span></div>':'')
        +'</div></section>';
    }

    /* what real customers said — Loop already collects and approves these */
    var revs=Array.isArray(d.reviews)?d.reviews:[];
    if(revs.length){
      h+='<section><h2>What people say</h2><div class="rev">'
        +revs.map(function(r){
          var nm=String(r.name||'').trim();
          return '<div class="rq"><div class="rhead">'
            +'<div class="av" aria-hidden="true">'+esc((nm.charAt(0)||'★').toUpperCase())+'</div>'
            +'<div>'+(nm?'<div class="who">'+esc(nm)+'</div>':'')
            +'<div class="st" aria-label="'+esc(r.rating)+' out of 5">'+stars(r.rating)+'</div></div></div>'
            +'<p>'+esc(r.text)+'</p></div>';
        }).join('')
        +'</div>'
        +(url(d.google_review_url)
          ? '<div style="margin-top:12px;text-align:center"><a class="btn ghost" href="'+url(d.google_review_url)
            +'" target="_blank" rel="noopener">Leave a review</a></div>' : '')
        +'</section>';
    } else if(url(d.google_review_url)){
      h+='<section><h2>Reviews</h2><div class="perk">'
        +'<div class="gst" aria-hidden="true">★★★★★</div>'
        +'<div class="big">Been in already?</div>'
        +'<p>A quick review helps other people find the shop.</p>'
        +'<a class="btn" href="'+url(d.google_review_url)+'" target="_blank" rel="noopener">Leave a review</a>'
        +'</div></section>';
    }

    /* rewards — the reason the site exists commercially */
    if(d.reward_text){
      h+='<section><h2>Rewards</h2><div class="perk">'
        +'<div class="pico" aria-hidden="true">'+ICO.gift+'</div>'
        // reward_text is stored mid-sentence ("a free haircut") because that is
        // how every other page uses it; as a headline it needs the article off
        // and the first letter up
        +'<div class="big">'+esc(d.reward_text.replace(/^an?\s+/i,'').replace(/^./,function(ch){ return ch.toUpperCase(); }))+'</div>'
        +'<p>Free to join. Collect a point every visit'
        +(d.reward_at?' — '+esc(d.reward_at)+' gets you there':'')+'.</p>'
        +'<a class="btn" href="/rewards/?c='+encodeURIComponent(d.client)+'">Join the rewards card</a>'
        +'</div></section>';
    }

    h+='<footer><b>'+esc(name)+'</b>'
      +(d.address?'<br>'+esc(d.address):'')
      +(d.phone?'<br><a href="tel:'+esc(ph)+'">'+esc(d.phone)+'</a>':'')
      +'<div class="powered">Site by <a href="https://thebarberloop.com/barbers/" target="_blank" rel="noopener">The Barber Loop</a></div>'
      +'</footer>'
      +(bookHref?'<div class="pad"></div>':'')
      +'</div>';

    /* sticky bar */
    if(bookHref){
      h+='<div class="stick" id="stick">'
        +'<a href="'+esc(bookHref)+'"'+(bookExt?' target="_blank" rel="noopener"':'')+'>'+ICO.cal+' Book now</a>'
        +(ph?'<a class="sec" href="tel:'+esc(ph)+'" aria-label="Call the shop">'+ICO.phone+'</a>':'')
        +(maps&&url(maps)?'<a class="sec" href="'+url(maps)+'" target="_blank" rel="noopener" aria-label="Get directions">'+ICO.pin+'</a>':'')
        +'</div>';
    }

    /* the shop's playlist */
    var trax=(Array.isArray(s.tracks)?s.tracks:[])
      .map(function(t){ return { name:(t&&t.name)||'', url:url(t&&t.url) }; })
      .filter(function(t){ return t.url; });
    if(trax.length){
      h+='<div class="music" id="music">'
        +'<div class="mlist hide" id="mlist" role="menu">'
        +trax.map(function(t,i){
          return '<button type="button" data-i="'+i+'" role="menuitem">'
            +esc(t.name||('Track '+(i+1)))+'</button>';
        }).join('')
        +'</div>'
        +'<button class="mbtn" id="mbtn" aria-pressed="false">'
        +'<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>'
        +'<span id="mtxt">Play the shop’s music</span></button>'
        +'</div>';
    }

    app.innerHTML=h;
    stick();
    music(trax, !!bookHref);
    jsonld(d,s,name,tz,maps);
  }

  /* ── the shop's music ──────────────────────────────────────────────────
     Deliberately silent until tapped: autoplay is blocked by every mobile
     browser worth naming, and a barbershop page that starts playing in a
     quiet office is a page that gets closed. One <audio> element reused
     across tracks, so switching never stacks up players. */
  function music(trax, hasBook){
    var box=document.getElementById('music'); if(!box||!trax.length) return;
    var btn=document.getElementById('mbtn'), list=document.getElementById('mlist'),
        txt=document.getElementById('mtxt');
    var au=new Audio(); au.preload='none'; au.loop=(trax.length===1);
    var cur=-1;

    function name(i){ return trax[i].name || ('Track ' + (i+1)); }
    function label(){
      txt.textContent = au.paused
        ? (cur<0 ? 'Play the shop’s music' : 'Play ' + name(cur))
        : name(cur);
      box.classList.toggle('on', !au.paused);
      btn.setAttribute('aria-pressed', String(!au.paused));
      [].forEach.call(list.querySelectorAll('button'), function(b,i){
        b.classList.toggle('cur', i===cur);
      });
    }
    function play(i){
      if(i!==cur){ cur=i; au.src=trax[i].url; }
      au.play().then(label).catch(function(){
        // a blocked or broken file must not leave a dead button
        txt.textContent='Could not play that one'; box.classList.remove('on');
      });
    }
    btn.addEventListener('click', function(){
      if(trax.length>1 && au.paused && cur<0){ list.classList.toggle('hide'); return; }
      if(au.paused) play(cur<0?0:cur); else { au.pause(); label(); }
    });
    list.addEventListener('click', function(ev){
      var b=ev.target.closest('button[data-i]'); if(!b) return;
      list.classList.add('hide');
      play(parseInt(b.getAttribute('data-i'),10));
    });
    // roll into the next track so a shop with five gets a playlist, not a loop
    au.addEventListener('ended', function(){
      if(trax.length>1){ play((cur+1)%trax.length); } else label();
    });
    au.addEventListener('pause', label);
    // never sit on top of the book bar once it appears
    if(hasBook){
      var bar=document.getElementById('stick');
      if(bar && window.MutationObserver){
        new MutationObserver(function(){ box.classList.toggle('up', bar.classList.contains('show')); })
          .observe(bar,{attributes:true,attributeFilter:['class']});
      }
    }
    label();
  }

  /* Show the sticky bar only once the hero's own book button has scrolled
     away, so the two never sit on screen together. IntersectionObserver where
     it exists; a scroll fallback everywhere else. */
  function stick(){
    var bar=document.getElementById('stick'), top=document.getElementById('bookTop');
    if(!bar||!top) return;
    function set(on){ bar.classList.toggle('show',on); }
    if(window.IntersectionObserver){
      new IntersectionObserver(function(es){ set(!es[0].isIntersecting); },{threshold:0}).observe(top);
    } else {
      var f=function(){ set(top.getBoundingClientRect().bottom < 0); };
      window.addEventListener('scroll',f,{passive:true}); f();
    }
  }

  /* ── LocalBusiness structured data ──────────────────────────────────────
     This is the part that actually earns its keep with Google: it lines the
     site's name / address / phone / hours up with the Google Business
     Profile, which is what the profile wants in its Website field. Built with
     DOM text (not innerHTML) so a quote in the shop name cannot break out of
     the JSON. */
  function jsonld(d,s,name,tz,maps){
    var spec=[];
    for(var i=0;i<7;i++){
      var t=d.hours&&d.hours[String(i)];
      if(t&&t.length===2) spec.push({
        '@type':'OpeningHoursSpecification',
        dayOfWeek:'https://schema.org/'+DAYS[i],
        opens:t[0], closes:t[1]
      });
    }
    var o={
      '@context':'https://schema.org','@type':'HairSalon',
      name:name, url:location.href
    };
    if(s.tagline||s.about) o.description=(s.about||s.tagline);
    if(d.phone) o.telephone=d.phone;
    if(d.address) o.address={'@type':'PostalAddress',streetAddress:d.address};
    if(/^https?:\/\//i.test(String(maps||''))) o.hasMap=maps;
    if(/^https?:\/\//i.test(String(s.hero||''))) o.image=s.hero;
    if(/^https?:\/\//i.test(String(s.logo||''))) o.logo=s.logo;
    if(spec.length) o.openingHoursSpecification=spec;
    // only claim an aggregate rating when there really is one to claim
    if(Number(d.reviews_n)>0 && Number(d.rating)>0){
      o.aggregateRating={'@type':'AggregateRating',
        ratingValue:String(d.rating), reviewCount:String(d.reviews_n)};
    }
    var same=[];
    if(s.ig) same.push('https://instagram.com/'+s.ig);
    if(s.tiktok) same.push('https://tiktok.com/@'+s.tiktok);
    if(same.length) o.sameAs=same;
    // the named chairs, so the shop's people line up with its Google listing
    var crew=(Array.isArray(s.barbers)?s.barbers:[]).filter(function(m){ return m&&m.name; });
    if(crew.length){
      o.employee=crew.map(function(m){
        var p={'@type':'Person',name:m.name};
        if(m.blurb) p.jobTitle=m.blurb;
        if(/^https?:\/\//i.test(String(m.photo||''))) p.image=m.photo;
        if(m.ig) p.sameAs=['https://instagram.com/'+m.ig];
        return p;
      });
    }
    var pays=(Array.isArray(s.pay)?s.pay:[]).filter(function(x){ return PAYLBL[x]; });
    if(pays.length) o.paymentAccepted=pays.map(function(x){ return PAYLBL[x]; }).join(', ');
    if(Array.isArray(d.services)&&d.services.length){
      o.makesOffer=d.services.map(function(x){
        return {'@type':'Offer',itemOffered:{'@type':'Service',name:(x&&x.name)||'Service'}};
      });
    }
    var tag=document.createElement('script');
    tag.type='application/ld+json';
    tag.textContent=JSON.stringify(o);
    document.head.appendChild(tag);
  }
})();
</script>
</body>
