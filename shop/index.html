<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loop Site</title>
<meta name="description" content="Book an appointment, see prices and hours, and join the rewards card." />
<meta name="theme-color" content="#111014" />
<link rel="preconnect" href="https://qgbjiqdwzgkjkmqyjsmc.supabase.co" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23111014'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' dominant-baseline='middle' font-size='30'%3E%F0%9F%92%88%3C/text%3E%3C/svg%3E" />
<style>
  /* ── Four themes, one template. Every theme sets the same eight tokens, so a
       new look is a token block and nothing else. A shop can override --acc
       alone with its own colour without touching the rest. ──────────────── */
  :root,[data-theme="classic"]{
    --bg:#f6f1e7; --bg2:#efe7d8; --ink:#17161a; --muted:#6a6558;
    --card:#fffdf8; --line:rgba(23,22,26,.14);
    --acc:#8c1d1d; --acc-ink:#fff; --hero:#17161a; --hero-ink:#f6f1e7;
  }
  [data-theme="fade"]{
    --bg:#0c0e13; --bg2:#11141b; --ink:#eef1f7; --muted:#98a0b2;
    --card:rgba(255,255,255,.045); --line:rgba(150,190,255,.18);
    --acc:#5df2e0; --acc-ink:#05070f; --hero:#05070f; --hero-ink:#eef1f7;
  }
  [data-theme="luxe"]{
    --bg:#0a0a0a; --bg2:#111; --ink:#f4efe4; --muted:#9d9484;
    --card:rgba(255,255,255,.04); --line:rgba(212,175,55,.26);
    --acc:#d4af37; --acc-ink:#0a0a0a; --hero:#000; --hero-ink:#f4efe4;
  }
  [data-theme="bold"]{
    --bg:#ffffff; --bg2:#f3f4f6; --ink:#101114; --muted:#5f6472;
    --card:#fff; --line:rgba(16,17,20,.12);
    --acc:#e11d48; --acc-ink:#fff; --hero:#101114; --hero-ink:#fff;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.6;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif}
  img{max-width:100%;display:block}
  a{color:inherit}
  .wrap{max-width:620px;margin:0 auto;padding:0 16px}
  /* room for the sticky bar so the footer is never trapped under it */
  .pad{height:86px}

  /* ── hero ─────────────────────────────────────────────────────────────
     With no photo the header still has to look designed rather than blank,
     so it gets a barber-pole stripe in the shop's own accent. */
  .hero{background:var(--hero);color:var(--hero-ink);position:relative;overflow:hidden}
  .hero .inner{padding:32px 0 28px;position:relative;z-index:1}
  .hero.plain::before{content:'';position:absolute;inset:0;opacity:.14;
    background:repeating-linear-gradient(135deg,var(--acc) 0 14px,transparent 14px 40px)}
  .heropic{position:relative}
  .heropic img{width:100%;height:250px;object-fit:cover;opacity:.45}
  .heropic .over{position:absolute;inset:0;display:flex;align-items:flex-end;
    background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.78))}
  .heropic .over .wrap{width:100%}
  .heropic .inner{padding-bottom:20px}
  .logo{width:66px;height:66px;border-radius:16px;object-fit:cover;margin-bottom:12px;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
  h1{font-size:30px;line-height:1.16;margin:0 0 6px;letter-spacing:-.5px;font-weight:900}
  .tag{color:var(--hero-ink);opacity:.78;margin:0;font-size:15px}
  .badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
  .pill{font-size:12.5px;font-weight:800;border-radius:999px;padding:5px 12px;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2)}
  .pill.open{background:#16a34a;border-color:transparent;color:#fff}
  .pill.stars{background:rgba(255,255,255,.14)}

  /* ── the funnel: one tall stack of taps, thumb-height, no hunting ───── */
  .acts{display:grid;gap:10px;margin:18px 0 4px}
  .act{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:800;font-size:16px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;color:var(--ink)}
  .act .ico{font-size:19px;width:24px;text-align:center;flex:0 0 24px}
  .act .sub{display:block;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:1px}
  .act .arw{margin-left:auto;color:var(--muted);font-weight:700}
  .act.primary{background:var(--acc);border-color:transparent;color:var(--acc-ink)}
  .act.primary .sub{color:var(--acc-ink);opacity:.82}
  .act.primary .arw{color:var(--acc-ink)}

  section{padding:26px 0 4px}
  h2{font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
    margin:0 0 12px;font-weight:800}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .row{display:flex;justify-content:space-between;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .nm{font-weight:700}
  .row .mn{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
  .row .pr{font-weight:800;white-space:nowrap}
  .row.today{background:color-mix(in srgb,var(--acc) 10%,transparent)}
  .row.today .nm{color:var(--acc)}

  .about{color:var(--muted);font-size:15px;margin:0}
  .team{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}

  .gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .gal>*{border-radius:12px;height:150px;width:100%;background:var(--bg2);overflow:hidden}
  .gal img{object-fit:cover;height:150px}
  .gal>*:first-child:nth-last-child(odd){grid-column:span 2;height:190px}
  /* stand-in art for a shop that has not uploaded photos yet: line drawings in
     the shop's own accent, so the page reads as designed instead of unfinished.
     One real photo and every placeholder disappears. */
  .ph{display:flex;align-items:center;justify-content:center;color:var(--acc);
    border:1px solid var(--line);background:
      linear-gradient(160deg,color-mix(in srgb,var(--acc) 9%,transparent),transparent 70%),var(--card)}
  .ph svg{width:52%;height:52%;opacity:.62}

  .rev{display:grid;gap:10px}
  .rq{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .rq .st{color:var(--acc);font-size:13px;letter-spacing:2px}
  .rq p{margin:6px 0 8px;font-size:14.5px}
  .rq .who{color:var(--muted);font-size:12.5px;font-weight:700}

  .perk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;text-align:center}
  .perk .big{font-size:19px;font-weight:900;margin:2px 0 4px}
  .perk p{color:var(--muted);font-size:14px;margin:0 0 14px}
  .btn{display:inline-block;background:var(--acc);color:var(--acc-ink);text-decoration:none;
    font-weight:800;border-radius:12px;padding:13px 22px;font-size:15px}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

  footer{margin-top:30px;padding:24px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
  footer b{color:var(--ink)}
  footer a{color:var(--muted)}
  .powered{margin-top:16px;font-size:12px;opacity:.75}

  /* ── sticky book bar ──────────────────────────────────────────────────
     The single biggest lift on a page like this: booking is never more than
     one tap away, no matter how far down they have scrolled. Hidden until
     the hero's own book button has gone off screen, so it never doubles up. */
  .stick{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);display:flex;gap:9px;
    transform:translateY(120%);transition:transform .22s ease}
  .stick.show{transform:none}
  .stick a{flex:1;text-align:center;text-decoration:none;font-weight:800;font-size:15.5px;
    border-radius:12px;padding:14px 10px;background:var(--acc);color:var(--acc-ink)}
  .stick a.sec{flex:0 0 56px;background:transparent;color:var(--ink);border:1px solid var(--line);font-size:19px;padding:12px 0}

  .state{max-width:520px;margin:0 auto;padding:70px 22px;text-align:center}
  .state .em{font-size:44px}
  .state h1{font-size:22px;margin:12px 0 8px}
  .state p{color:var(--muted);margin:0}
  @media(min-width:560px){ h1{font-size:36px} .heropic img{height:300px} }
  @media(prefers-reduced-motion:reduce){ .stick{transition:none} }
</style>
</head>
<body>
<div id="app"><div class="state"><div class="em">💈</div><p>Loading…</p></div></div>

<script>
(function(){
  "use strict";
  var SUPA_URL='https://qgbjiqdwzgkjkmqyjsmc.supabase.co';
  var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnYmppcWR3emdramttcXlqc21jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNzc1NTEsImV4cCI6MjA5OTk1MzU1MX0.Naocw-B0B6Z7CLg197yxLezd58a6f5XoMLEiea5b0Ro';

  var app=document.getElementById('app');
  var q=new URLSearchParams(location.search);
  var slug=(q.get('c')||'').toLowerCase().replace(/[^a-z0-9]/g,'');

  // Declared up here, not down beside the code that uses them: every path
  // below can return early, and a `var` assignment that is skipped leaves the
  // hoisted binding undefined.
  var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  /* Line-art stand-ins for a shop with no photos yet. Inline SVG rather than
     stock photography: nothing to license, and another shop's interior on a
     barber's own page would read as a lie. They take currentColor, so they
     recolour with the theme. */
  var ART=[
    // barber pole
    '<svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><rect x="37" y="16" width="26" height="68" rx="13" stroke="currentColor" stroke-width="3.5"/><path d="M41 38 58 26M41 54 58 42M41 70 58 58" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><rect x="31" y="8" width="38" height="9" rx="4.5" fill="currentColor"/><rect x="31" y="83" width="38" height="9" rx="4.5" fill="currentColor"/></svg>',
    // scissors
    '<svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><circle cx="31" cy="76" r="11" stroke="currentColor" stroke-width="4"/><circle cx="69" cy="76" r="11" stroke="currentColor" stroke-width="4"/><path d="M37 67 73 15M63 67 27 15" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>',
    // clippers — the toothed blade is what makes these readable at tile size,
    // so it is drawn wider than the body and given real teeth
    '<svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><rect x="35" y="20" width="30" height="48" rx="8" stroke="currentColor" stroke-width="4"/><path d="M43 33h14M43 43h14" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".55"/><path d="M31 68h38v9H31z" fill="currentColor"/><path d="M35 77v8M42 77v8M49 77v8M56 77v8M63 77v8" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M44 20v-9M56 20v-9" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>',
    // comb
    '<svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><rect x="16" y="29" width="68" height="14" rx="7" fill="currentColor"/><path d="M23 43v27M32 43v27M41 43v27M50 43v27M59 43v27M68 43v27M77 43v27" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>'
  ];

  /* Everything below renders into innerHTML, so nothing reaches the page
     unescaped. esc() covers text and quoted attributes; url() is a second
     line of defence behind site_sanitize() — a stored javascript: that
     somehow predates the sanitiser still must not become a live href. */
  function esc(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function url(u){ u=String(u==null?'':u).trim(); return /^https?:\/\//i.test(u)?esc(u):''; }
  function tel(p){ return String(p==null?'':p).replace(/[^0-9+]/g,''); }
  function hex(h){ return /^#[0-9A-Fa-f]{6}$/.test(String(h||'')) ? String(h) : ''; }

  function state(em,title,msg){
    app.innerHTML='<div class="state"><div class="em">'+em+'</div><h1>'+esc(title)+'</h1><p>'+esc(msg)+'</p></div>';
  }

  if(!slug){ state('💈','No shop selected','This link is missing its shop code.'); return; }

  /* Preview mode. The owner's editor holds a payload the public RPC will not
     hand out (the site is not published yet), so it posts that payload in
     rather than us re-implementing the whole page inside the editor — one
     renderer, no drift. Same-origin only, and only when the URL opted in. */
  if(location.hash==='#preview'){
    state('👁','Preview','Waiting for the editor…');
    window.addEventListener('message',function(ev){
      if(ev.origin!==location.origin) return;
      var m=ev.data;
      if(!m||m.tbShopPreview!==true||!m.data) return;
      try{ render(m.data); }catch(e){ state('⚠️','Preview failed',String(e&&e.message||e)); }
    });
    if(window.parent&&window.parent!==window) window.parent.postMessage({tbShopPreviewReady:true},location.origin);
    return;
  }

  fetch(SUPA_URL+'/rest/v1/rpc/shop_site',{
    method:'POST',
    headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_client:slug})
  })
  .then(function(r){ return r.ok?r.json():null; })
  .then(function(d){
    if(!d||d.error){ state('💈','Shop not found','Check the link and try again.'); return; }
    if(!d.published){
      document.title=(d.biz_name||'Shop');
      state('🚧',(d.biz_name||'This shop')+' — coming soon','The website for this shop is not published yet.');
      return;
    }
    render(d);
  })
  .catch(function(){ state('📵','Could not load','Check your connection and refresh.'); });

  /* ── hours ─────────────────────────────────────────────────────────────
     hours is {"0".."6":["HH:MM","HH:MM"]} keyed by JS day number, and the
     shop's timezone is authoritative — a customer browsing from another
     timezone must still see the SHOP as open or closed, so "now" is read
     back out of Intl rather than off the local clock. */
  function shopNow(tz){
    var f;
    try{
      f=new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short',hour:'2-digit',
        minute:'2-digit',hour12:false});
    }catch(e){
      f=new Intl.DateTimeFormat('en-US',{weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false});
    }
    var parts={}; f.formatToParts(new Date()).forEach(function(p){ parts[p.type]=p.value; });
    var wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(parts.weekday);
    // '24' is how some engines render midnight in hour12:false
    var hh=parseInt(parts.hour,10); if(hh===24) hh=0;
    return { day:(wd<0?new Date().getDay():wd), mins:hh*60+parseInt(parts.minute,10) };
  }
  function toMins(hm){
    var m=/^(\d{1,2}):(\d{2})$/.exec(String(hm||'')); if(!m) return null;
    return parseInt(m[1],10)*60+parseInt(m[2],10);
  }
  function pretty(hm){
    var t=toMins(hm); if(t===null) return '';
    var h=Math.floor(t/60), mn=t%60, ap=h<12?'AM':'PM', h12=h%12; if(h12===0) h12=12;
    return h12+(mn?':'+String(mn).padStart(2,'0'):'')+' '+ap;
  }
  function isOpen(hours,tz){
    var n=shopNow(tz), t=hours&&hours[String(n.day)];
    if(!t||!t.length) return {open:false,day:n.day};
    var a=toMins(t[0]), b=toMins(t[1]);
    if(a===null||b===null) return {open:false,day:n.day};
    // a close time earlier than the open time means it runs past midnight
    var open = b>a ? (n.mins>=a&&n.mins<b) : (n.mins>=a||n.mins<b);
    return {open:open,day:n.day,close:t[1]};
  }
  function stars(n){
    var r=Math.round(Number(n)||0), s='';
    for(var i=0;i<5;i++) s+= i<r ? '★' : '☆';
    return s;
  }

  function render(d){
    var s=d.site||{}, name=d.biz_name||'', tz=d.tz||'America/New_York';
    var root=document.documentElement;
    root.setAttribute('data-theme', s.theme||'classic');
    // the shop's own colour, if it set one, overrides only the accent token
    var acc=hex(s.accent);
    if(acc){
      root.style.setProperty('--acc',acc);
      // keep label text readable on whatever they picked
      var r=parseInt(acc.substr(1,2),16), g=parseInt(acc.substr(3,2),16), b2=parseInt(acc.substr(5,2),16);
      root.style.setProperty('--acc-ink',(r*299+g*587+b2*114)/1000 > 150 ? '#101114' : '#ffffff');
    } else {
      root.style.removeProperty('--acc'); root.style.removeProperty('--acc-ink');
    }

    document.title=name+(s.tagline?' — '+s.tagline:' — Book online');
    var md=document.querySelector('meta[name=description]');
    if(md) md.setAttribute('content',
      (s.about||s.tagline||('Book an appointment at '+name+'.')).slice(0,155));

    /* Where "Book" goes. A shop already on Booksy/Square keeps its own link —
       fighting that loses the sale. Otherwise the loyalty card IS the booking
       page, which is the whole point: the website feeds Loop. */
    var bookHref = d.book_url
      ? (/^https?:\/\//i.test(String(d.book_url).trim()) ? String(d.book_url).trim() : 'https://'+String(d.book_url).trim())
      : (d.booking_on ? '/rewards/?c='+encodeURIComponent(d.client) : '');
    var bookExt = !!d.book_url;

    var ph=tel(d.phone);
    var maps = s.maps || (d.address ? 'https://www.google.com/maps/search/?api=1&query='
      +encodeURIComponent(name+' '+d.address) : '');
    var op=isOpen(d.hours,tz);
    var hasHours=!!(d.hours&&Object.keys(d.hours).length);
    var nrev=Number(d.reviews_n||0);

    var h='';

    /* hero */
    var heroInner='<div class="wrap"><div class="inner">'
      +(url(s.logo)?'<img class="logo" src="'+url(s.logo)+'" alt="'+esc(name)+' logo">':'')
      +'<h1>'+esc(name)+'</h1>'
      +(s.tagline?'<p class="tag">'+esc(s.tagline)+'</p>':'')
      +'<div class="badges">'
      +(hasHours?'<span class="pill '+(op.open?'open':'')+'">'
        +(op.open?'Open now'+(op.close?' · until '+esc(pretty(op.close)):''):'Closed right now')+'</span>':'')
      +(nrev?'<span class="pill stars">'+stars(d.rating)+' '+esc(d.rating)+' ('+nrev+')</span>':'')
      +'</div></div></div>';
    h += url(s.hero)
      ? '<header class="hero"><div class="heropic"><img src="'+url(s.hero)+'" alt="">'
        +'<div class="over">'+heroInner+'</div></div></header>'
      : '<header class="hero plain">'+heroInner+'</header>';

    h+='<div class="wrap">';

    /* the tap stack — this is the funnel */
    h+='<nav class="acts" aria-label="Quick actions">';
    if(bookHref){
      h+='<a class="act primary" id="bookTop" href="'+esc(bookHref)+'"'+(bookExt?' target="_blank" rel="noopener"':'')+'>'
        +'<span class="ico" aria-hidden="true">📅</span><span>Book an appointment'
        +'<span class="sub">Pick your time in a few taps</span></span><span class="arw" aria-hidden="true">→</span></a>';
    }
    if(ph){
      h+='<a class="act'+(bookHref?'':' primary')+'" href="tel:'+esc(ph)+'">'
        +'<span class="ico" aria-hidden="true">📞</span><span>Call the shop'
        +'<span class="sub">'+esc(d.phone)+'</span></span><span class="arw" aria-hidden="true">→</span></a>';
      // barbers and their customers run on text, not email
      if(s.sms!==false){
        h+='<a class="act" href="sms:'+esc(ph)+'">'
          +'<span class="ico" aria-hidden="true">💬</span><span>Text the shop'
          +'<span class="sub">Quick question? Send a text</span></span><span class="arw" aria-hidden="true">→</span></a>';
      }
    }
    if(maps&&url(maps)){
      h+='<a class="act" href="'+url(maps)+'" target="_blank" rel="noopener">'
        +'<span class="ico" aria-hidden="true">📍</span><span>Get directions'
        +(d.address?'<span class="sub">'+esc(d.address)+'</span>':'')
        +'</span><span class="arw" aria-hidden="true">→</span></a>';
    }
    if(s.ig){
      h+='<a class="act" href="https://instagram.com/'+encodeURIComponent(s.ig)+'" target="_blank" rel="noopener">'
        +'<span class="ico" aria-hidden="true">📸</span><span>Instagram'
        +'<span class="sub">@'+esc(s.ig)+'</span></span><span class="arw" aria-hidden="true">→</span></a>';
    }
    if(s.tiktok){
      h+='<a class="act" href="https://tiktok.com/@'+encodeURIComponent(s.tiktok)+'" target="_blank" rel="noopener">'
        +'<span class="ico" aria-hidden="true">🎵</span><span>TikTok'
        +'<span class="sub">@'+esc(s.tiktok)+'</span></span><span class="arw" aria-hidden="true">→</span></a>';
    }
    // whatever else the shop sells — gift cards, product, a second location
    (Array.isArray(s.buttons)?s.buttons:[]).forEach(function(bn){
      if(!bn||!bn.label||!url(bn.url)) return;
      h+='<a class="act" href="'+url(bn.url)+'" target="_blank" rel="noopener">'
        +'<span class="ico" aria-hidden="true">🔗</span><span>'+esc(bn.label)
        +'</span><span class="arw" aria-hidden="true">→</span></a>';
    });
    h+='</nav>';

    if(s.about) h+='<section><h2>About</h2><p class="about">'+esc(s.about)+'</p></section>';

    /* services */
    var svc=Array.isArray(d.services)?d.services:[];
    if(svc.length){
      h+='<section><h2>Services</h2><div class="card">';
      svc.forEach(function(x){
        h+='<div class="row"><span><span class="nm">'+esc(x&&x.name||'Service')+'</span>'
          +(x&&x.mins?'<span class="mn">'+esc(x.mins)+' min</span>':'')+'</span>'
          +'<span class="pr">'+esc(x&&x.price||'')+'</span></div>';
      });
      h+='</div></section>';
    }

    /* photos, or the stand-in art until there are some */
    var pics=(Array.isArray(s.photos)?s.photos:[]).map(url).filter(Boolean);
    h+='<section><h2>'+(pics.length?'Work':'Inside the shop')+'</h2><div class="gal">'
      +(pics.length
        ? pics.map(function(p){ return '<img src="'+p+'" alt="" loading="lazy">'; }).join('')
        : ART.slice(0,4).map(function(a){ return '<div class="ph">'+a+'</div>'; }).join(''))
      +'</div></section>';

    /* hours */
    if(hasHours){
      h+='<section><h2>Hours</h2><div class="card">';
      for(var i=0;i<7;i++){
        var t=d.hours[String(i)];
        h+='<div class="row'+(i===op.day?' today':'')+'"><span class="nm">'+DAYS[i]+'</span>'
          +'<span class="pr">'+(t&&t.length?esc(pretty(t[0])+' – '+pretty(t[1])):'Closed')+'</span></div>';
      }
      h+='</div></section>';
    }

    /* team */
    if(Array.isArray(d.team)&&d.team.length){
      h+='<section><h2>Barbers</h2><div class="team">'
        +d.team.map(function(m){ return '<span class="chip">'+esc(m&&m.name||'')+'</span>'; }).join('')
        +'</div></section>';
    }

    /* what real customers said — Loop already collects and approves these */
    var revs=Array.isArray(d.reviews)?d.reviews:[];
    if(revs.length){
      h+='<section><h2>What people say</h2><div class="rev">'
        +revs.map(function(r){
          return '<div class="rq"><div class="st" aria-label="'+esc(r.rating)+' out of 5">'+stars(r.rating)+'</div>'
            +'<p>'+esc(r.text)+'</p>'
            +(r.name?'<div class="who">— '+esc(r.name)+'</div>':'')+'</div>';
        }).join('')
        +'</div>'
        +(url(d.google_review_url)
          ? '<div style="margin-top:12px;text-align:center"><a class="btn ghost" href="'+url(d.google_review_url)
            +'" target="_blank" rel="noopener">Leave a review</a></div>' : '')
        +'</section>';
    } else if(url(d.google_review_url)){
      h+='<section><h2>Reviews</h2><div class="perk">'
        +'<div class="big">⭐ Been in already?</div>'
        +'<p>A quick review helps other people find the shop.</p>'
        +'<a class="btn" href="'+url(d.google_review_url)+'" target="_blank" rel="noopener">Leave a review</a>'
        +'</div></section>';
    }

    /* rewards — the reason the site exists commercially */
    if(d.reward_text){
      h+='<section><h2>Rewards</h2><div class="perk">'
        // reward_text is stored mid-sentence ("a free haircut") because that is
        // how every other page uses it; as a headline it needs the article off
        // and the first letter up
        +'<div class="big">🎁 '+esc(d.reward_text.replace(/^an?\s+/i,'').replace(/^./,function(ch){ return ch.toUpperCase(); }))+'</div>'
        +'<p>Free to join. Collect a point every visit'
        +(d.reward_at?' — '+esc(d.reward_at)+' gets you there':'')+'.</p>'
        +'<a class="btn" href="/rewards/?c='+encodeURIComponent(d.client)+'">Join the rewards card</a>'
        +'</div></section>';
    }

    h+='<footer><b>'+esc(name)+'</b>'
      +(d.address?'<br>'+esc(d.address):'')
      +(d.phone?'<br><a href="tel:'+esc(ph)+'">'+esc(d.phone)+'</a>':'')
      +'<div class="powered">Site by <a href="https://tbsol.net/barbers/" target="_blank" rel="noopener">Loop</a></div>'
      +'</footer>'
      +(bookHref?'<div class="pad"></div>':'')
      +'</div>';

    /* sticky bar */
    if(bookHref){
      h+='<div class="stick" id="stick">'
        +'<a href="'+esc(bookHref)+'"'+(bookExt?' target="_blank" rel="noopener"':'')+'>📅 Book now</a>'
        +(ph?'<a class="sec" href="tel:'+esc(ph)+'" aria-label="Call the shop">📞</a>':'')
        +(maps&&url(maps)?'<a class="sec" href="'+url(maps)+'" target="_blank" rel="noopener" aria-label="Get directions">📍</a>':'')
        +'</div>';
    }

    app.innerHTML=h;
    stick();
    jsonld(d,s,name,tz,maps);
  }

  /* Show the sticky bar only once the hero's own book button has scrolled
     away, so the two never sit on screen together. IntersectionObserver where
     it exists; a scroll fallback everywhere else. */
  function stick(){
    var bar=document.getElementById('stick'), top=document.getElementById('bookTop');
    if(!bar||!top) return;
    function set(on){ bar.classList.toggle('show',on); }
    if(window.IntersectionObserver){
      new IntersectionObserver(function(es){ set(!es[0].isIntersecting); },{threshold:0}).observe(top);
    } else {
      var f=function(){ set(top.getBoundingClientRect().bottom < 0); };
      window.addEventListener('scroll',f,{passive:true}); f();
    }
  }

  /* ── LocalBusiness structured data ──────────────────────────────────────
     This is the part that actually earns its keep with Google: it lines the
     site's name / address / phone / hours up with the Google Business
     Profile, which is what the profile wants in its Website field. Built with
     DOM text (not innerHTML) so a quote in the shop name cannot break out of
     the JSON. */
  function jsonld(d,s,name,tz,maps){
    var spec=[];
    for(var i=0;i<7;i++){
      var t=d.hours&&d.hours[String(i)];
      if(t&&t.length===2) spec.push({
        '@type':'OpeningHoursSpecification',
        dayOfWeek:'https://schema.org/'+DAYS[i],
        opens:t[0], closes:t[1]
      });
    }
    var o={
      '@context':'https://schema.org','@type':'HairSalon',
      name:name, url:location.href
    };
    if(s.tagline||s.about) o.description=(s.about||s.tagline);
    if(d.phone) o.telephone=d.phone;
    if(d.address) o.address={'@type':'PostalAddress',streetAddress:d.address};
    if(/^https?:\/\//i.test(String(maps||''))) o.hasMap=maps;
    if(/^https?:\/\//i.test(String(s.hero||''))) o.image=s.hero;
    if(/^https?:\/\//i.test(String(s.logo||''))) o.logo=s.logo;
    if(spec.length) o.openingHoursSpecification=spec;
    // only claim an aggregate rating when there really is one to claim
    if(Number(d.reviews_n)>0 && Number(d.rating)>0){
      o.aggregateRating={'@type':'AggregateRating',
        ratingValue:String(d.rating), reviewCount:String(d.reviews_n)};
    }
    var same=[];
    if(s.ig) same.push('https://instagram.com/'+s.ig);
    if(s.tiktok) same.push('https://tiktok.com/@'+s.tiktok);
    if(same.length) o.sameAs=same;
    if(Array.isArray(d.services)&&d.services.length){
      o.makesOffer=d.services.map(function(x){
        return {'@type':'Offer',itemOffered:{'@type':'Service',name:(x&&x.name)||'Service'}};
      });
    }
    var tag=document.createElement('script');
    tag.type='application/ld+json';
    tag.textContent=JSON.stringify(o);
    document.head.appendChild(tag);
  }
})();
</script>
