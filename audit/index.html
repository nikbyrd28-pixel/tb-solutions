<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Google checkup | TB Solutions</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFD23F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314110F'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' dominant-baseline='middle' font-family='Arial Black,Arial' font-weight='900' font-size='28' fill='%23FFD23F'%3ETB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@96,80..92,400..800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--yellow:#FFD23F;--ink:#14110F;--paper:#FFF8E1;--copper:#B5542B;--green:#1F9D55;--red:#D7263D;--muted:#6b645a;--line:#e6dfc8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
header{background:var(--yellow);padding:24px 0 32px}
nav{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:24px}
nav .brand{text-decoration:none;display:flex;align-items:center;gap:.5em}
nav .brand b{background:var(--ink);color:var(--yellow);padding:.1em .45em;border-radius:6px}
.kick{display:inline-block;background:var(--ink);color:var(--yellow);font-weight:800;padding:.3em .7em;border-radius:8px;transform:rotate(-1.5deg);margin-bottom:.8em;font-size:.85em}
h1{font-size:clamp(34px,7vw,64px);font-weight:800;line-height:.95;letter-spacing:-.03em;font-variation-settings:"opsz" 96,"wdth" 88}
.lead{font-size:clamp(17px,2vw,21px);font-weight:500;margin-top:.7em;max-width:30em}
main{padding:24px 0 40px}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.score div{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:6px 6px 0 var(--ink)}
.score .n{font-size:clamp(28px,6vw,42px);font-weight:800;line-height:1;letter-spacing:-.03em}
.score .l{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
.score .bad .n{color:var(--red)}.score .ok .n{color:var(--green)}.score .mid .n{color:var(--copper)}
.prog{height:12px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin:16px 0 6px}
.prog i{display:block;height:100%;background:var(--green);transition:width .6s}
.when{font-size:13px;color:var(--muted);font-weight:700}
h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:28px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 b{color:var(--ink)}
.step{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;box-shadow:5px 5px 0 var(--ink)}
.step.done{box-shadow:5px 5px 0 var(--green);border-color:var(--green)}
.step.doing{box-shadow:5px 5px 0 var(--copper);border-color:var(--copper)}
.step .box{width:38px;height:38px;border-radius:12px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:0 0 auto;background:#fff}
.step.done .box{background:var(--green);border-color:var(--green);color:#fff}
.step.doing .box{background:var(--copper);border-color:var(--copper);color:#fff}
.step h3{font-size:18px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.step .tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:middle;background:var(--yellow)}
.step.done .tag{background:var(--green);color:#fff}.step.doing .tag{background:var(--copper);color:#fff}
.step .find{margin-top:8px;font-weight:700;font-size:16px;background:var(--paper);border-left:4px solid var(--red);padding:6px 10px;border-radius:0 10px 10px 0}
.step.done .find{border-left-color:var(--green)}.step.doing .find{border-left-color:var(--copper)}
.step .how{font-size:14px;color:var(--muted);font-weight:600;margin-top:8px;line-height:1.4}
.cta{background:var(--ink);color:var(--paper);border-radius:20px;padding:24px;margin-top:32px;text-align:center}
.cta h3{color:var(--yellow);font-size:clamp(22px,4vw,30px);font-weight:800;line-height:1.05;letter-spacing:-.02em}
.cta p{margin:10px auto 16px;max-width:32em;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:.5em;background:var(--yellow);color:var(--ink);text-decoration:none;font-weight:800;padding:.85em 1.4em;border-radius:999px;border:3px solid var(--yellow);font-size:1em;margin:4px}
.btn.ghost{background:transparent;color:var(--yellow)}
.empty{text-align:center;padding:60px 20px;font-weight:700;color:var(--muted)}
footer{padding:18px 0 40px;font-size:.85em;font-weight:500;color:var(--muted);text-align:center}
@media print{header,.step{box-shadow:none!important;break-inside:avoid}.cta,nav{display:none}body{background:#fff}}
</style>
</head>
<body>
<header><div class="wrap">
  <nav><a class="brand" href="https://tbsol.net"><b>TB</b> Solutions</a><a href="sms:+14848418501" style="text-decoration:none;border-bottom:3px solid var(--ink)">Text Nick</a></nav>
  <span class="kick" id="kick">Google checkup</span>
  <h1 id="name">Loading…</h1>
  <p class="lead" id="lead"></p>
</div></header>

<main class="wrap" id="main"><div class="empty">Pulling up your checkup…</div></main>

<footer class="wrap">TB Solutions · the works for the trades · Pottstown, PA · <a href="https://tbsol.net">tbsol.net</a></footer>

<script>
const supa=window.supabase.createClient('https://qgbjiqdwzgkjkmqyjsmc.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnYmppcWR3emdramttcXlqc21jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNzc1NTEsImV4cCI6MjA5OTk1MzU1MX0.Naocw-B0B6Z7CLg197yxLezd58a6f5XoMLEiea5b0Ro');
const $=id=>document.getElementById(id), esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GLYPH={todo:'',doing:'…',done:'✓',na:'–'}, TAG={todo:'needs fixing',doing:'in progress',done:'fixed',na:''};
(async()=>{
  const t=new URLSearchParams(location.search).get('t');
  const {data,error}=t?await supa.rpc('audit_public',{p_token:t}):{data:null};
  if(error||!data){ $('name').textContent='Checkup not found'; $('main').innerHTML='<div class="empty">This link isn\'t live. Text Nick at (484) 841-8501 and he\'ll send a fresh one.</div>'; return; }
  document.title=data.name+' — Google checkup | TB Solutions';
  $('name').textContent=data.name;
  const where=[data.trade,data.town].filter(Boolean).join(' · ');
  const items=(data.items||[]).filter(i=>i.status!=='na'), done=items.filter(i=>i.status==='done'), doing=items.filter(i=>i.status==='doing'), todo=items.filter(i=>i.status==='todo');
  const working=['active','done'].includes(data.status);
  $('kick').textContent=working?'Your Google Rank Fix: live progress':'Your Google checkup';
  $('lead').textContent=working
    ?`${where?where+'. ':''}Every step of the fix, updated as it's done. ${done.length} of ${items.length} finished.`
    :`${where?where+'. ':''}I went through everything about ${data.name} that shows up online. Here's what's holding the ranking back, and what I'd fix — in the order it'd get done.`;
  const groups=[]; items.forEach(i=>{ if(!groups.includes(i.grp)) groups.push(i.grp); });
  const flagged=todo.filter(i=>i.finding).length;
  $('main').innerHTML=`
    <div class="score">
      <div class="${flagged?'bad':'ok'}"><div class="n">${working?todo.length:flagged||todo.length}</div><div class="l">${working?'still to do':'problems found'}</div></div>
      <div class="mid"><div class="n">${doing.length}</div><div class="l">in progress</div></div>
      <div class="ok"><div class="n">${done.length}</div><div class="l">fixed</div></div>
    </div>
    <div class="prog"><i style="width:${items.length?Math.round(done.length/items.length*100):0}%"></i></div>
    <div class="when">Updated ${new Date(data.updated_at).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</div>
    ${groups.map(g=>{ const gi=items.filter(i=>i.grp===g); return `<h2><span>${esc(g)}</span><b>${gi.filter(i=>i.status==='done').length}/${gi.length}</b></h2>`+gi.map(i=>`<div class="step ${esc(i.status)}">
        <div class="box">${GLYPH[i.status]||''}</div>
        <div><h3>${esc(i.label)}${TAG[i.status]?`<span class="tag">${TAG[i.status]}</span>`:''}</h3>
          ${i.finding?`<div class="find">${esc(i.finding)}</div>`:''}
          ${i.how?`<div class="how">${esc(i.how)}</div>`:''}</div>
      </div>`).join(''); }).join('')}
    <div class="cta">
      <h3>${working?'Questions? Text me.':'Want this done?'}</h3>
      <p>${working?'Every step above updates as it\'s finished. If something looks off, text me and I\'ll look same day.':'One text and I start. No contracts, month to month, you keep the domain, the Google profile and every login. Most of this list is done inside two weeks.'}</p>
      <a class="btn" href="sms:+14848418501&body=${encodeURIComponent('Hey Nick, saw the checkup for '+data.name+'. Let’s talk.')}">Text Nick</a>
      <a class="btn ghost" href="https://tbsol.net/rank/">What the Rank Fix includes →</a>
    </div>`;
})();
</script>
</body>
</html>
