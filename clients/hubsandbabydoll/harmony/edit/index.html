<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0B0C">
<title>Edit Harmony page | Hubs &amp; Babydoll</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0B0B0C;--bg2:#141214;--bg3:#1C1917;--fg:#F4EBDD;--fg2:#B8AD9C;--fg3:#7E7568;--gold:#D9A441;--gold2:#F0C76A;--red:#C25A4A;--green:#2E7D4F;--line:rgba(217,164,65,.22);
  --display:"Cormorant Garamond",Georgia,serif;--body:"Figtree","Helvetica Neue",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.1}
h1{font-size:1.9rem}h2{font-size:1.6rem}h3{font-size:1.2rem;font-family:var(--body);font-weight:600}
p{margin:0}
a{color:var(--gold)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:10;background:rgba(11,11,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding-block:8px}
header .logo{font-family:var(--display);font-size:1.3rem;text-decoration:none;color:var(--fg)}
header .logo em{color:var(--gold);font-style:normal}
header .tools{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;background:var(--gold);color:#1A1205;font-weight:700;padding:12px 18px;border-radius:4px;text-decoration:none;font:inherit;font-weight:700;border:0;cursor:pointer;min-height:44px}
.btn:hover{background:var(--gold2)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:.85rem;min-height:36px;white-space:nowrap}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
main{padding:20px 0 80px}
.hint{color:var(--fg3);font-size:.85rem}
/* login */
.login{max-width:380px;margin:60px auto;display:flex;flex-direction:column;gap:14px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:24px 20px}
.login h1{font-size:1.7rem}
/* sections */
section.sec{background:var(--bg2);border:1px solid var(--line);border-radius:8px;margin-top:16px;overflow:hidden}
section.sec>summary,section.sec .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;cursor:pointer;list-style:none}
section.sec .hd h2{font-size:1.4rem}
section.sec .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:14px}
section.sec.closed .body{display:none}
section.sec .hd .arrow{color:var(--gold);transition:transform .2s}
section.sec.closed .hd .arrow{transform:rotate(-90deg)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.szrow label.lab{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
input[type=text],input[type=email],input[type=password],input[type=number],textarea,select{width:100%;background:var(--bg3);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:11px 12px;font:inherit;font-size:16px;line-height:1.4}
textarea{min-height:88px;resize:vertical}
input[type=number]{max-width:140px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.szrow{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--bg);display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:end}
.szrow .field input[type=number]{max-width:none}
.szrow .ctl2{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.item .ih{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item .ih b{font-size:.9rem}
.list{display:flex;flex-direction:column;gap:10px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.9rem;color:var(--fg2);min-height:44px}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle .sw{width:42px;height:24px;border-radius:12px;background:var(--bg3);border:1px solid var(--line);position:relative;transition:background .15s;flex:none}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--fg3);transition:transform .15s,background .15s}
.toggle input:checked+.sw{background:var(--red);border-color:var(--red)}
.toggle input:checked+.sw::after{transform:translateX(18px);background:#fff}
.img{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
.img .prev{width:72px;height:96px;object-fit:cover;background:var(--bg3);border-radius:4px;border:1px solid var(--line)}
.img .ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.img input[type=text]{font-size:.8rem}
.upl{font-weight:600;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--line);color:var(--fg);border-radius:4px;padding:9px 12px;font-size:.85rem;cursor:pointer;min-height:40px;width:max-content}
.upl input{display:none}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:4px}
.actions .st{font-size:.82rem;color:var(--fg3)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#1A1205;font-weight:600;padding:12px 18px;border-radius:4px;z-index:70;font-size:.95rem;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--red);color:#fff}
.msg{color:var(--red);font-size:.9rem;min-height:1.2em}
.topnote{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.topnote .who{font-size:.85rem;color:var(--fg3)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="../">H<em>&amp;</em>B <span style="color:var(--fg3);font-family:var(--body);font-size:.8rem;margin-left:4px">editor</span></a>
  <div class="tools" id="tools" hidden>
    <a class="btn ghost sm" href="../" target="_blank" rel="noopener">Preview page</a>
    <button class="btn ghost sm" type="button" id="logout">Log out</button>
  </div>
</div></header>

<main><div class="wrap">

  <form class="login" id="login" autocomplete="on">
    <h1>Edit the Harmony page</h1>
    <p class="hint">Log in with your HQ email and password. Changes go live on the page as soon as you save.</p>
    <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <div class="msg" id="lmsg" role="alert"></div>
    <button class="btn" type="submit" id="loginBtn">Log in</button>
  </form>

  <div id="app" hidden>
    <div class="topnote">
      <h1>Harmony page</h1>
      <span class="who" id="who"></span>
    </div>
    <p class="hint">Each box is one part of the page, in the order it appears. Change what you want, then tap Save in that box. Text shows exactly as you type it.</p>
    <div id="sections"></div>
  </div>

</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var SUPA_URL="https://qgbjiqdwzgkjkmqyjsmc.supabase.co";
  var SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnYmppcWR3emdramttcXlqc21jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNzc1NTEsImV4cCI6MjA5OTk1MzU1MX0.Naocw-B0B6Z7CLg197yxLezd58a6f5XoMLEiea5b0Ro";
  var PAGE="harmony", BUCKET="hb-site";
  var $=function(s,r){return (r||document).querySelector(s)};
  var supa=null, user=null, C={}, dirty={};
  function toast(t,bad){var el=document.createElement("div");el.className="toast"+(bad?" bad":"");el.textContent=t;document.body.appendChild(el);setTimeout(function(){el.remove()},bad?4000:2200)}
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}

  // ---- the form, section by section, in page order ----
  // type: text | textarea | html (textarea that allows links) | number | image | list (array of objects with fields)
  var SECTIONS=[
    {id:"top",title:"Announcement bar",fields:[{k:"announce",l:"Gold bar at the top",t:"text"}]},
    {id:"hero",title:"Top of page",fields:[
      {k:"hero.eyebrow",l:"Small line above the title",t:"text"},
      {k:"hero.h1",l:"Title",t:"text"},
      {k:"hero.lead",l:"Intro paragraph",t:"textarea"},
      {k:"hero.ship",l:"Shipping line",t:"text"},
      {k:"hero.pickup",l:"Pickup line",t:"text"},
      {k:"hero.gift",l:"Gift line",t:"text"}
    ]},
    {id:"scents",title:"Scents",fields:[
      {k:"scents",l:"Scents",t:"list",item:"Scent",add:{key:"",name:"",note:"",img:""},fields:[
        {k:"name",l:"Name",t:"text"},{k:"note",l:"Short note under the name",t:"text"},{k:"img",l:"Bottle photo",t:"image"},{k:"key",l:"Code (short, no spaces, do not change for existing scents)",t:"text"}
      ]}
    ]},
    {id:"prices",title:"Oil sizes and prices",fields:[
      {k:"oil.sizes",l:"Sizes",t:"list",item:"Size",add:{size:"",price:0,note:""},fields:[
        {k:"size",l:"Size (for example 4 oz)",t:"text"},{k:"price",l:"Price $",t:"number"},{k:"note",l:"Note (for example about two months)",t:"text"}
      ]},
      {k:"oil.default_size",l:"Size picked when the page opens",t:"text"}
    ]},
    {id:"deals",title:"Quantity deals and shipping",fields:[
      {k:"oil.tiers",l:"Quantity tiers",t:"list",item:"Tier",add:{qty:1,off:0,label:""},fields:[
        {k:"qty",l:"Bottles",t:"number"},{k:"off",l:"% off",t:"number"},{k:"label",l:"Label on the button (blank for none)",t:"text"}
      ]},
      {k:"ship.free_at",l:"Free shipping when the cart reaches $",t:"number"},
      {k:"ship.flat",l:"Estimated shipping under that $",t:"number"}
    ]},
    {id:"routine",title:"Goes well with",fields:[{k:"routine.h2",l:"Heading",t:"text"},{k:"routine.lead",l:"Line under it",t:"textarea"}]},
    {id:"about",title:"About the oil",fields:[
      {k:"about.h2",l:"Heading",t:"text"},
      {k:"about.rows",l:"Rows",t:"list",item:"Row",add:{t:"",d:""},fields:[{k:"t",l:"Label",t:"text"},{k:"d",l:"Text",t:"html"}]},
      {k:"about.img",l:"Photo",t:"image"}
    ]},
    {id:"ing",title:"What is in it",fields:[
      {k:"ing.h2",l:"Heading",t:"text"},{k:"ing.lead",l:"Line under it",t:"textarea"},
      {k:"ing.items",l:"Ingredients",t:"list",item:"Ingredient",add:{h:"",p:""},fields:[{k:"h",l:"Name",t:"text"},{k:"p",l:"Description",t:"textarea"}]}
    ]},
    {id:"howto",title:"How to use it",fields:[
      {k:"howto.h2",l:"Heading",t:"text"},
      {k:"howto.steps",l:"Steps",t:"list",item:"Step",add:"",fields:null},
      {k:"howto.note",l:"Note under the steps",t:"textarea"}
    ]},
    {id:"more",title:"Other things we make",fields:[{k:"more.h2",l:"Heading",t:"text"},{k:"more.lead",l:"Line under it (links allowed)",t:"html"}]},
    {id:"products",title:"Products (butters, washes, beard, sets)",fields:[
      {k:"products",l:"Products",t:"list",item:"Product",add:{id:"",name:"",scent:"",cat:"set",img:"",why:"",sizes:[{size:"",price:0,sold_out:false}]},fields:[
        {k:"name",l:"Name",t:"text"},{k:"why",l:"One line about it",t:"textarea"},{k:"img",l:"Photo",t:"image"},
        {k:"sizes",l:"Sizes and prices",t:"sizes"},
        {k:"cat",l:"Type",t:"select",opts:["butter","wash","beard","set"]},
        {k:"scent",l:"Scent code (jas, bay, choc, pep, lav)",t:"text"},
        {k:"id",l:"Code (short, no spaces, do not change for existing products)",t:"text"}
      ]}
    ]},
    {id:"story",title:"Who makes it",fields:[
      {k:"story.h2",l:"Heading",t:"text"},{k:"story.p",l:"Paragraph",t:"textarea"},{k:"story.quote",l:"Quote",t:"textarea"},{k:"story.sig",l:"Signature",t:"text"}
    ]},
    {id:"faq",title:"Common questions",fields:[
      {k:"faq.h2",l:"Heading",t:"text"},
      {k:"faq.items",l:"Questions",t:"list",item:"Question",add:{q:"",a:""},fields:[{k:"q",l:"Question",t:"text"},{k:"a",l:"Answer (links allowed)",t:"html"}]}
    ]},
    {id:"final",title:"Bottom of page",fields:[
      {k:"final.h2",l:"Heading",t:"text"},{k:"final.btn",l:"Button text",t:"text"},{k:"final.sub",l:"Small line under the button",t:"text"},{k:"footer.copy",l:"Footer line",t:"text"}
    ]}
  ];

  // ---- rendering ----
  function fieldHtml(f,path,val){
    var id="f_"+path.replace(/[^a-z0-9]/gi,"_");
    var lab='<label for="'+id+'">'+esc(f.l)+'</label>';
    if(f.t==="text") return '<div class="field">'+lab+'<input type="text" id="'+id+'" data-path="'+esc(path)+'" value="'+esc(val)+'"></div>';
    if(f.t==="textarea"||f.t==="html") return '<div class="field">'+lab+'<textarea id="'+id+'" data-path="'+esc(path)+'">'+esc(val)+'</textarea></div>';
    if(f.t==="number") return '<div class="field">'+lab+'<input type="number" inputmode="decimal" step="any" id="'+id+'" data-path="'+esc(path)+'" data-num="1" value="'+esc(val==null?"":val)+'"></div>';
    if(f.t==="select") return '<div class="field">'+lab+'<select id="'+id+'" data-path="'+esc(path)+'">'+f.opts.map(function(o){return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>'}).join("")+'</select></div>';
    if(f.t==="image") return '<div class="field">'+lab+'<div class="img"><img class="prev" src="'+esc(imgSrc(val))+'" alt=""><div class="ctl">'+
      '<label class="upl">Upload photo<input type="file" accept="image/*" data-upload="'+esc(path)+'"></label>'+
      '<input type="text" id="'+id+'" data-path="'+esc(path)+'" data-img="1" value="'+esc(val)+'" placeholder="or paste an image link"></div></div></div>';
    if(f.t==="sizes") return '<div class="field">'+lab+'<div class="list" data-sizes="'+esc(path)+'">'+(val||[]).map(function(s,i){return sizeRow(path+"|"+i,s)}).join("")+'</div>'+
      '<button class="btn ghost sm" type="button" data-addsize="'+esc(path)+'" style="width:max-content">+ Add a size</button></div>';
    if(f.t==="list"){
      var items=(val||[]).map(function(it,i){return itemHtml(f,path+"|"+i,it,i)}).join("");
      return '<div class="field"><label>'+esc(f.l)+'</label><div class="list" data-list="'+esc(path)+'">'+items+'</div>'+
        '<button class="btn ghost sm" type="button" data-additem="'+esc(path)+'" style="width:max-content">+ Add '+esc(f.item.toLowerCase())+'</button></div>';
    }
    return "";
  }
  function sizeRow(path,s){
    return '<div class="szrow"><div class="field"><label class="lab">Size</label><input type="text" data-path="'+esc(path+"|size")+'" value="'+esc(s.size)+'"></div>'+
      '<div class="field"><label class="lab">Price $</label><input type="number" inputmode="decimal" step="any" data-path="'+esc(path+"|price")+'" data-num="1" value="'+esc(s.price)+'"></div>'+
      '<div class="ctl2"><label class="toggle"><input type="checkbox" data-path="'+esc(path+"|sold_out")+'" data-bool="1"'+(s.sold_out?' checked':'')+'><span class="sw"></span>Sold out</label>'+
      '<button class="btn danger sm" type="button" data-remove="'+esc(path)+'">Remove</button></div></div>';
  }
  function itemHtml(f,path,it,i){
    var title=f.fields?(it.name||it.q||it.h||it.t||it.size||(it.qty!=null?it.qty+" bottle"+(it.qty==1?"":"s"):"")||f.item+" "+(i+1)):(f.item+" "+(i+1));
    var inner=f.fields?f.fields.map(function(sf){return fieldHtml(sf,path+"|"+sf.k,it[sf.k])}).join(""):
      '<div class="field"><textarea data-path="'+esc(path)+'">'+esc(it)+'</textarea></div>';
    return '<div class="item" data-item="'+esc(path)+'"><div class="ih"><b>'+esc(title)+'</b><div style="display:flex;gap:6px">'+
      '<button class="btn ghost sm" type="button" data-move="-1" title="Move up">&uarr;</button><button class="btn ghost sm" type="button" data-move="1" title="Move down">&darr;</button>'+
      '<button class="btn danger sm" type="button" data-remove="'+esc(path)+'">Remove</button></div></div>'+inner+'</div>';
  }
  function imgSrc(v){if(!v)return "";return /^https?:/.test(v)?v:"../"+v}
  function sectionHtml(s){
    return '<section class="sec" id="sec_'+s.id+'"><div class="hd" data-toggle><h2>'+esc(s.title)+'</h2><span class="arrow">&#9660;</span></div><div class="body">'+
      s.fields.map(function(f){return fieldHtml(f,f.k,C[f.k])}).join("")+
      '<div class="actions"><span class="st" data-status></span><button class="btn" type="button" data-save="'+s.id+'">Save</button></div></div></section>';
  }
  function renderAll(){$("#sections").innerHTML=SECTIONS.map(sectionHtml).join("")}
  function rerenderSection(id){var s=SECTIONS.filter(function(x){return x.id===id})[0];var old=$("#sec_"+id);var open=!old.classList.contains("closed");var d=document.createElement("div");d.innerHTML=sectionHtml(s);var n=d.firstChild;if(!open)n.classList.add("closed");old.replaceWith(n)}

  // ---- read form back into C (for one section) ----
  // paths look like "faq.items|2|a": the first part is the content key, the rest walks into it
  function setPath(root,path,v){var parts=path.split("|");var k=parts.shift();if(!parts.length){root[k]=v;return}
    if(root[k]==null)root[k]=/^\d+$/.test(parts[0])?[]:{}; var cur=root[k]; while(parts.length>1){var p=parts.shift();if(cur[p]==null)cur[p]=/^\d+$/.test(parts[0])?[]:{};cur=cur[p]} cur[parts[0]]=v}
  function collect(sec){
    var el=$("#sec_"+sec.id);
    el.querySelectorAll("[data-path]").forEach(function(inp){
      var v; if(inp.getAttribute("data-bool")) v=inp.checked; else if(inp.getAttribute("data-num")) v=inp.value===""?0:+inp.value; else v=inp.value;
      if(typeof v==="string"&&!(inp.tagName==="TEXTAREA")) v=v.trim();
      setPath(C,inp.getAttribute("data-path"),v);
    });
  }
  function sectionOf(el){var s=el.closest("section.sec");return SECTIONS.filter(function(x){return "sec_"+x.id===s.id})[0]}
  function getPath(path){return path.split("|").reduce(function(o,k){return o==null?o:o[k]},C)}
  function parentAndIndex(path){var parts=path.split("|");var i=+parts.pop();return {arr:getPath(parts.join("|")),i:i}}

  // ---- validation before save ----
  function validate(sec){
    var bad=null;
    sec.fields.forEach(function(f){
      var v=C[f.k];
      if(f.t==="number"&&(isNaN(v)||v<0)) bad=f.l+" must be a number.";
      if(f.t==="list"&&(!Array.isArray(v)||!v.length)) bad=f.l+" needs at least one entry.";
      if(f.k==="scents") v.forEach(function(s){if(!s.key||/\s/.test(s.key))bad="Each scent needs a code with no spaces.";if(!s.name)bad="Each scent needs a name."});
      if(f.k==="oil.sizes") v.forEach(function(s){if(!s.size)bad="Each size needs a name.";if(!(+s.price>0))bad="Each size needs a price above 0."});
      if(f.k==="oil.tiers") v.forEach(function(t){if(!(+t.qty>=1))bad="Tier quantity must be 1 or more."});
      if(f.k==="products") v.forEach(function(p){if(!p.id||/\s/.test(p.id))bad="Each product needs a code with no spaces.";if(!p.name)bad="Each product needs a name.";if(!p.sizes||!p.sizes.length)bad=p.name+" needs at least one size.";(p.sizes||[]).forEach(function(s){if(!s.size)bad=p.name+": each size needs a name."})});
    });
    if(sec.id==="prices"&&C["oil.sizes"].every(function(s){return s.size!==C["oil.default_size"]})) bad="The default size must match one of the sizes.";
    return bad;
  }

  // ---- save ----
  async function saveSection(id,btn){
    var sec=SECTIONS.filter(function(x){return x.id===id})[0];
    collect(sec);
    var err=validate(sec); if(err){toast(err,true);return}
    btn.disabled=true; var st=$("[data-status]",$("#sec_"+id)); st.textContent="Saving...";
    var rows=sec.fields.map(function(f){return {page:PAGE,key:f.k,value:C[f.k]}});
    var r=await supa.from("hb_site_content").upsert(rows,{onConflict:"page,key"});
    btn.disabled=false;
    if(r.error){st.textContent="Not saved";toast("Save failed: "+(r.error.message||"check your login"),true);return}
    st.textContent="Saved "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
    toast("Saved. The page is updated.");
    rerenderSection(id);
  }

  // ---- image upload ----
  async function upload(file,path,inp){
    if(!file) return;
    if(file.size>8*1024*1024){toast("Photo is over 8 MB. Pick a smaller one.",true);return}
    var ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
    var name=PAGE+"/"+path.replace(/[^a-z0-9]+/gi,"-").toLowerCase()+"-"+Date.now()+"."+ext;
    toast("Uploading...");
    var r=await supa.storage.from(BUCKET).upload(name,file,{upsert:false,contentType:file.type||"image/jpeg",cacheControl:"31536000"});
    if(r.error){toast("Upload failed: "+r.error.message,true);return}
    var url=supa.storage.from(BUCKET).getPublicUrl(name).data.publicUrl;
    var txt=inp.closest(".img").querySelector("[data-img]"); txt.value=url;
    inp.closest(".img").querySelector(".prev").src=url;
    toast("Photo uploaded. Tap Save to use it.");
  }

  // ---- events ----
  document.addEventListener("click",function(e){
    var t=e.target;
    var tg=t.closest("[data-toggle]"); if(tg){tg.closest("section.sec").classList.toggle("closed");return}
    var sv=t.closest("[data-save]"); if(sv){saveSection(sv.getAttribute("data-save"),sv);return}
    var sec=t.closest("section.sec")?sectionOf(t):null;
    var ad=t.closest("[data-additem]"); if(ad){collect(sec);var path=ad.getAttribute("data-additem");var f=sec.fields.filter(function(x){return x.k===path})[0];var arr=getPath(path)||[];arr.push(typeof f.add==="string"?"":JSON.parse(JSON.stringify(f.add)));C[path]=arr;rerenderSection(sec.id);return}
    var as=t.closest("[data-addsize]"); if(as){collect(sec);var p=as.getAttribute("data-addsize");var arr2=getPath(p)||[];arr2.push({size:"",price:0,sold_out:false});rerenderSection(sec.id);return}
    var rm=t.closest("[data-remove]"); if(rm){collect(sec);var pi=parentAndIndex(rm.getAttribute("data-remove"));if(pi.arr&&pi.arr.length>1){if(!confirm("Remove this?"))return;pi.arr.splice(pi.i,1);rerenderSection(sec.id)}else toast("Keep at least one.",true);return}
    var mv=t.closest("[data-move]"); if(mv){collect(sec);var it=mv.closest("[data-item]");var q=parentAndIndex(it.getAttribute("data-item"));var j=q.i+(+mv.getAttribute("data-move"));if(j<0||j>=q.arr.length)return;var tmp=q.arr[q.i];q.arr[q.i]=q.arr[j];q.arr[j]=tmp;rerenderSection(sec.id);return}
  });
  document.addEventListener("change",function(e){
    var up=e.target.closest("[data-upload]"); if(up){upload(up.files[0],up.getAttribute("data-upload"),up);up.value="";return}
    var im=e.target.closest("[data-img]"); if(im){im.closest(".img").querySelector(".prev").src=imgSrc(im.value.trim())}
  });

  // ---- auth ----
  function showLogin(msg){$("#login").hidden=false;$("#app").hidden=true;$("#tools").hidden=true;if(msg)$("#lmsg").textContent=msg}
  async function enter(u){
    user=u; $("#who").textContent=u.email||"";
    var adm=await supa.rpc("is_hq_admin");
    if(adm.error||adm.data!==true){await supa.auth.signOut();showLogin("This login is not on the admin list. Ask Nick to add "+(u.email||"you")+" to hq_admins.");return}
    var r=await supa.from("hb_site_content").select("key,value").eq("page",PAGE);
    if(r.error){showLogin("Could not load content: "+r.error.message);return}
    C={}; (r.data||[]).forEach(function(row){C[row.key]=row.value});
    var missing=SECTIONS.reduce(function(a,s){return a.concat(s.fields.filter(function(f){return C[f.k]===undefined}).map(function(f){return f.k}))},[]);
    if(missing.length){toast("Some fields are not in the database yet: "+missing.slice(0,3).join(", ")+(missing.length>3?"...":"")+". Run the migration.",true)}
    SECTIONS.forEach(function(s){s.fields.forEach(function(f){if(C[f.k]===undefined)C[f.k]=f.t==="list"||f.t==="sizes"?[]:f.t==="number"?0:""})});
    $("#login").hidden=true;$("#app").hidden=false;$("#tools").hidden=false;
    renderAll();
    SECTIONS.forEach(function(s,i){if(i>1)$("#sec_"+s.id).classList.add("closed")});
  }
  $("#login").addEventListener("submit",async function(e){
    e.preventDefault(); if(!supa){$("#lmsg").textContent="Could not load the login library. Check your connection and reload.";return}
    $("#lmsg").textContent=""; $("#loginBtn").disabled=true;
    var r=await supa.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    $("#loginBtn").disabled=false;
    if(r.error){$("#lmsg").textContent=r.error.message;return}
    enter(r.data.user);
  });
  $("#logout").addEventListener("click",async function(){await supa.auth.signOut();location.reload()});

  if(window.supabase&&window.supabase.createClient){
    supa=window.supabase.createClient(SUPA_URL,SUPA_KEY);
    supa.auth.getSession().then(function(r){if(r.data&&r.data.session)enter(r.data.session.user);else showLogin()}).catch(function(){showLogin()});
  } else { showLogin("Could not load the login library. Check your connection and reload."); }
})();
</script>
</body>
</html>
