e="central" font-size="14" font-weight="600" fill="#712B13">Consultation in home</text><text x="495.0" y="120" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">About an hour, no deciding</text><line x1="495" y1="140" x2="495" y2="162" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><rect x="370" y="164" width="250" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width=".8"/><text x="495.0" y="182" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">Day 0 · quote email + text</text><text x="495.0" y="200" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Good for 14 days</text><line x1="495" y1="220" x2="495" y2="242" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><rect x="370" y="244" width="250" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width=".8"/><text x="495.0" y="262" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">Day 3 · 7 · 13 reminders</text><text x="495.0" y="280" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Text, email, text</text><line x1="495" y1="300" x2="495" y2="322" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><rect x="370" y="324" width="250" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width=".8"/><text x="495.0" y="342" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">Accepted · agreement email</text><text x="495.0" y="360" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">DocuSign link</text><line x1="495" y1="380" x2="495" y2="402" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><rect x="370" y="404" width="250" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width=".8"/><text x="495.0" y="422" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">Signed · deposit email</text><text x="495.0" y="440" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Stripe link + portal login</text><line x1="495" y1="460" x2="495" y2="482" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><rect x="370" y="484" width="250" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width=".8"/><text x="495.0" y="502" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">Deposit paid · start locked</text><text x="495.0" y="520" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Text + portal welcome</text><text x="495" y="570" text-anchor="middle" font-size="12" fill="#555">Declined at any point → back to nurture</text></svg>