<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="680" height="640"><title>Nurture and quote timelines</title><rect width="680" height="640" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round"/></marker></defs><style>text{font-family:system-ui,sans-serif}</style><rect x="40" y="40" width="290" height="560" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width=".8"/><text x="60" y="62" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Nurture (until consult booked)</text><rect x="60" y="84" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width=".8"/><text x="185.0" y="102" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Instant · welcome email</text><text x="185.0" y="120" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Meet-me video, next steps</text><line x1="185" y1="140" x2="185" y2="162" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="164" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width=".8"/><text x="185.0" y="182" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Instant · text + mom alert</text><text x="185.0" y="200" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">WhatsApp with score</text><line x1="185" y1="220" x2="185" y2="242" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="244" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width=".8"/><text x="185.0" y="262" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">4h · text if unopened</text><text x="185.0" y="280" text-anchor="middle" dominant-baseline="central" font-size="12" f