<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TB HQ</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14110F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314110F'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' dominant-baseline='middle' font-family='Arial Black,Arial' font-weight='900' font-size='28' fill='%23FFD23F'%3EHQ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--yellow:#FFD23F;--ink:#14110F;--paper:#FFF8E1;--copper:#B5542B;--blue:#1B4FD8;--green:#1F9D55;--red:#D7263D;--card:#fff;--line:#e6dfc8;--muted:#6b645a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--yellow);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
header b{background:var(--yellow);color:var(--ink);padding:2px 8px;border-radius:6px;font-weight:800}
header .sp{flex:1}
header button{background:transparent;border:2px solid var(--yellow);color:var(--yellow);border-radius:999px;padding:4px 12px;font-weight:700;cursor:pointer}
.tabs{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;background:var(--ink)}
.tabs button{flex:0 0 auto;background:transparent;color:var(--paper);border:2px solid #3a342c;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.tabs button i{font-style:normal;background:var(--red);color:#fff;border-radius:999px;padding:0 6px;font-size:12px;margin-left:6px}
main{padding:14px 16px 90px;max-width:900px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:10px;text-align:center}
.stats .n{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.02em}
.stats .l{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.filters button.on{border-color:var(--ink);color:var(--ink)}
.card{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:4px 4px 0 var(--ink)}
.card.won{box-shadow:4px 4px 0 var(--green)}
.card.lost{opacity:.55;box-shadow:none}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{font-size:18px;line-height:1.1;font-weight:800}
.card .biz{font-weight:600;color:var(--muted);font-size:14px}
.src{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:6px;background:var(--yellow);white-space:nowrap}
.src.lsa{background:var(--red);color:#fff}.src.rx-msg{background:var(--blue);color:#fff}.src.dne{background:var(--copper);color:#fff}.src.intake{background:var(--ink);color:var(--yellow)}
.sum{font-size:14px;margin:8px 0 4px;color:#3a342c}
.val{font-weight:800;color:var(--copper);font-size:14px}
.when{font-size:12px;color:var(--muted);font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.acts a,.acts button{border:2px solid var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;text-decoration:none;background:var(--card);cursor:pointer}
.acts a.call{background:var(--ink);color:var(--yellow)}
.acts select{border:2px solid var(--ink);border-radius:10px;padding:6px 8px;font-weight:700;background:#fff}
.acts select.new{background:var(--yellow)}.acts select.won{background:var(--green);color:#fff}.acts select.lost{background:#ddd}
.note{width:100%;margin-top:8px;border:2px solid var(--line);border-radius:10px;padding:8px;font-size:14px;min-height:40px;resize:vertical;display:none}
.note.show{display:block}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-weight:600}
.login{max-width:360px;margin:60px auto;padding:0 16px}
.login h1{font-size:34px;font-weight:800;margin-bottom:12px;letter-spacing:-.02em}
.login input{width:100%;border:2px solid var(--ink);border-radius:12px;padding:12px;margin-bottom:10px}
.login button{width:100%;background:var(--ink);color:var(--yellow);border:0;border-radius:999px;padding:12px;font-weight:800;cursor:pointer}
.msg{margin-top:10px;font-weight:700;color:var(--red)}
.hidden{display:none}
h2{font-size:20px;font-weight:800;margin:18px 0 8px}
.call .tr{font-size:13px;color:var(--muted);margin-top:4px}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:#eee;margin-right:4px;text-transform:uppercase}
.pill.emergency,.pill.urgent{background:var(--red);color:#fff}.pill.booked{background:var(--green);color:#fff}
.ed{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:4px 4px 0 var(--ink)}
.ed h3{font-size:16px;font-weight:800;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.ed h3:first-child{margin-top:0}
.f{display:grid;gap:4px;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;font-weight:600;color:var(--ink);background:#fff;width:100%}
.f textarea{min-height:120px;resize:vertical;font-weight:500;line-height:1.4}
.f.big textarea{min-height:220px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:480px){.g3{grid-template-columns:1fr 1fr}}
.hrs{display:grid;gap:6px}
.hrs div{display:grid;grid-template-columns:3.2em 1fr 1fr 3em;gap:6px;align-items:center;font-weight:700;font-size:13px}
.hrs input[type=time]{border:2px solid var(--line);border-radius:8px;padding:5px;font-weight:600}
.svc{border:2px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.svc.off{opacity:.5}
.svc .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;cursor:pointer}
.svc .body{display:none;margin-top:8px}
.svc.open .body{display:block}
.bar{position:sticky;bottom:0;background:var(--paper);padding:10px 0 max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;border-top:2px solid var(--line);margin-top:10px}
.bar button{border:2px solid var(--ink);border-radius:999px;padding:10px 18px;font-weight:800;cursor:pointer;background:var(--card)}
.bar button.save{background:var(--ink);color:var(--yellow)}
.bar .st{font-size:13px;font-weight:700;color:var(--green)}
.tog{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.tog input{width:auto}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><b>TB</b> HQ <span class="sp"></span><span id="who" style="font-size:13px;opacity:.7"></span><button id="out" class="hidden">Log out</button></header>

<div class="login" id="login">
  <h1>HQ.</h1>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="go">Log in</button>
  <div class="msg" id="lmsg"></div>
</div>

<div id="app" class="hidden">
  <div class="tabs">
    <button data-tab="leads" class="on">Leads<i id="nLeads"></i></button>
    <button data-tab="rx">Receptionist<i id="nRx"></i></button>
    <button data-tab="clients">RX Clients</button>
  </div>
  <main>
    <section id="t-leads">
      <div class="stats" id="leadStats"></div>
      <div class="filters" id="leadFilters"></div>
      <div id="leads"></div>
    </section>
    <section id="t-rx" class="hidden">
      <div class="stats" id="rxStats"></div>
      <h2>Booked jobs</h2><div id="jobs"></div>
      <h2>Calls (30 days)</h2><div id="calls"></div>
    </section>
    <section id="t-clients" class="hidden">
      <div id="bizList">
        <div class="acts" style="margin:0 0 12px"><button id="newBiz" class="call" style="background:var(--ink);color:var(--yellow)">+ New client line</button></div>
        <div id="bizs"></div>
      </div>
      <div id="bizEdit" class="hidden"></div>
    </section>
  </main>
</div>

<script>
const SUPA_URL='https://qgbjiqdwzgkjkmqyjsmc.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnYmppcWR3emdramttcXlqc21jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNzc1NTEsImV4cCI6MjA5OTk1MzU1MX0.Naocw-B0B6Z7CLg197yxLezd58a6f5XoMLEiea5b0Ro';
const supa=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const $=id=>document.getElementById(id), esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STATUSES=['new','contacted','audit_sent','quoted','won','lost'];
let leads=[], rx=null, filter='open';

function ago(ts){ if(!ts) return ''; const d=(Date.now()-new Date(ts))/6e4; if(d<60) return Math.round(d)+'m ago'; if(d<1440) return Math.round(d/60)+'h ago'; if(d<10080) return Math.round(d/1440)+'d ago'; return new Date(ts).toLocaleDateString(); }
function tel(p){ return (p||'').replace(/[^\d+]/g,''); }
function fmtPhone(p){ const d=(p||'').replace(/\D/g,'').replace(/^1/,''); return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:p||''; }

// ---- auth ----
supa.auth.getSession().then(r=>{ if(r.data.session) enter(r.data.session.user); });
$('go').onclick=login; $('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
async function login(){ const {data,error}=await supa.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value}); if(error){ $('lmsg').textContent=error.message; return; } enter(data.user); }
$('out').onclick=async()=>{ await supa.auth.signOut(); location.reload(); };
async function enter(u){
  const {data:ok}=await supa.rpc('is_hq_admin');
  if(!ok){ $('lmsg').textContent='This account is not an HQ admin.'; await supa.auth.signOut(); return; }
  $('login').classList.add('hidden'); $('app').classList.remove('hidden'); $('out').classList.remove('hidden'); $('who').textContent=u.email;
  load();
}

// ---- tabs ----
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['leads','rx','clients'].forEach(t=>$('t-'+t).classList.toggle('hidden',t!==b.dataset.tab));
});

async function load(){
  const [p,r]=await Promise.all([supa.rpc('hq_pipeline',{p_days:180}), supa.rpc('hq_rx',{p_days:30})]);
  if(p.error){ $('leads').innerHTML='<div class="empty">'+esc(p.error.message)+'</div>'; } else { leads=p.data||[]; renderLeads(); }
  if(r.error){ $('jobs').innerHTML='<div class="empty">'+esc(r.error.message)+'</div>'; } else { rx=r.data; renderRx(); }
}

// ---- leads ----
function renderLeads(){
  const open=leads.filter(l=>!['won','lost'].includes(l.status));
  const fresh=leads.filter(l=>l.status==='new');
  const won=leads.filter(l=>l.status==='won');
  $('nLeads').textContent=fresh.length||''; $('nLeads').style.display=fresh.length?'':'none';
  $('leadStats').innerHTML=[[fresh.length,'New'],[open.length,'Open'],[won.length,'Won'],[leads.filter(l=>l.src==='lsa').length,'LSA audits']].map(([n,l])=>`<div><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  const srcs=[...new Set(leads.map(l=>l.src.split(':')[0]))];
  $('leadFilters').innerHTML=[['open','Open'],['new','New'],['all','All'],['won','Won'],...srcs.map(s=>[s,s.toUpperCase()])].map(([k,l])=>`<button data-f="${k}" class="${filter===k?'on':''}">${l}</button>`).join('');
  $('leadFilters').querySelectorAll('button').forEach(b=>b.onclick=()=>{ filter=b.dataset.f; renderLeads(); });
  const list=leads.filter(l=> filter==='all' || (filter==='open'?!['won','lost'].includes(l.status): filter==='new'||filter==='won'? l.status===filter : l.src.split(':')[0]===filter));
  $('leads').innerHTML=list.length?list.map(card).join(''):'<div class="empty">Nothing here. Go make the phone ring.</div>';
  $('leads').querySelectorAll('select').forEach(s=>s.onchange=e=>setStatus(e.target));
  $('leads').querySelectorAll('button.n').forEach(b=>b.onclick=()=>{ const t=$('note-'+b.dataset.k); t.classList.toggle('show'); t.focus(); });
  $('leads').querySelectorAll('textarea').forEach(t=>t.onblur=()=>saveNote(t));
}
function card(l){
  const k=(l.src+'_'+l.id).replace(/[^a-z0-9_]/gi,'_'), srcCls=l.src.split(':')[0];
  const opts=(STATUSES.includes(l.status)?STATUSES:[l.status,...STATUSES]).map(s=>`<option ${s===l.status?'selected':''}>${s}</option>`).join('');
  return `<div class="card ${l.status}" id="c-${k}">
    <div class="top"><div><h3>${esc(l.name||'(no name)')}</h3><div class="biz">${esc(l.business||'')}</div></div><span class="src ${srcCls}">${esc(l.src)}</span></div>
    <div class="sum">${esc(l.summary||'')}</div>
    ${l.value_hint?`<div class="val">${esc(l.value_hint)}</div>`:''}
    <div class="when">${ago(l.created_at)}${l.email?' · '+esc(l.email):''}</div>
    <div class="acts">
      ${l.phone?`<a class="call" href="tel:${tel(l.phone)}">Call ${esc(fmtPhone(l.phone))}</a><a href="sms:${tel(l.phone)}">Text</a>`:''}
      <select class="${l.status}" data-src="${esc(l.src)}" data-id="${esc(l.id)}" ${l.src==='dne'?'disabled title="Manage in DNE portal"':''}>${opts}</select>
      <button class="n" data-k="${k}">Note</button>
    </div>
    <textarea class="note ${l.notes?'show':''}" id="note-${k}" data-src="${esc(l.src)}" data-id="${esc(l.id)}" placeholder="Notes…">${esc(l.notes||'')}</textarea>
  </div>`;
}
async function setStatus(sel){
  const {error}=await supa.rpc('hq_set_status',{p_src:sel.dataset.src,p_id:sel.dataset.id,p_status:sel.value});
  if(error){ alert(error.message); return; }
  const l=leads.find(x=>x.src===sel.dataset.src&&x.id===sel.dataset.id); if(l) l.status=sel.value; renderLeads();
}
async function saveNote(t){
  const l=leads.find(x=>x.src===t.dataset.src&&x.id===t.dataset.id); if(!l||(l.notes||'')===t.value) return;
  const {error}=await supa.rpc('hq_set_status',{p_src:l.src,p_id:l.id,p_status:l.status,p_notes:t.value}); if(error) alert(error.message); else l.notes=t.value;
}

// ---- receptionist ----
function renderRx(){
  if(!rx){ return; }
  const s=rx.stats||{};
  $('nRx').textContent=s.unhandled_msgs||''; $('nRx').style.display=s.unhandled_msgs?'':'none';
  $('rxStats').innerHTML=[[s.calls||0,'Calls / 30d'],[s.jobs||0,'Jobs booked'],['$'+Math.round(s.booked_value||0).toLocaleString(),'Fees booked'],[(rx.businesses||[]).filter(b=>b.active).length,'Active lines']].map(([n,l])=>`<div><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  $('jobs').innerHTML=(rx.jobs||[]).length?rx.jobs.map(j=>`<div class="card">
      <div class="top"><div><h3>${esc(j.customer_name||'(no name)')}</h3><div class="biz">${esc(j.business)} · ${esc(j.address||'')}</div></div><span class="pill ${esc(j.status)}">${esc(j.status)}</span></div>
      <div class="sum">${j.urgency?`<span class="pill ${esc(j.urgency)}">${esc(j.urgency)}</span>`:''}${esc(j.issue||'')}</div>
      <div class="when">${j.window_start?new Date(j.window_start).toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric'})+'–'+new Date(j.window_end).toLocaleTimeString([], {hour:'numeric'}):''} ${j.fee?'· $'+j.fee:''} · ${ago(j.created_at)}</div>
      <div class="acts">${j.customer_phone?`<a class="call" href="tel:${tel(j.customer_phone)}">Call</a>`:''}
        <select data-job="${j.id}">${['booked','confirmed','done','cancelled','no_show'].map(x=>`<option ${x===j.status?'selected':''}>${x}</option>`).join('')}</select></div>
    </div>`).join(''):'<div class="empty">No jobs booked yet. Call the demo line and book one.</div>';
  $('jobs').querySelectorAll('select').forEach(sel=>sel.onchange=async()=>{ const {error}=await supa.rpc('hq_rx_job_status',{p_id:sel.dataset.job,p_status:sel.value}); if(error) alert(error.message); });
  $('calls').innerHTML=(rx.calls||[]).length?rx.calls.map(c=>`<div class="card call">
      <div class="top"><div><h3>${esc(fmtPhone(c.caller_phone)||'unknown')}</h3><div class="biz">${esc(c.business)} · ${c.duration_s?Math.round(c.duration_s/60*10)/10+' min':''}</div></div>
        <span>${c.urgency?`<span class="pill ${esc(c.urgency)}">${esc(c.urgency)}</span>`:''}<span class="pill">${esc(c.outcome||'?')}</span></span></div>
      <div class="sum">${esc(c.summary||'')}</div>
      <div class="tr">${ago(c.started_at)}${c.owner_notified?' · owner texted':''}${c.caller_texted?' · caller texted':''}${c.recording_url?` · <a href="${esc(c.recording_url)}" target="_blank">recording</a>`:''}</div>
    </div>`).join(''):'<div class="empty">No calls in the last 30 days.</div>';
  $('bizs').innerHTML=(rx.businesses||[]).map(b=>`<div class="card">
      <div class="top"><div><h3>${esc(b.name)}</h3><div class="biz">${esc(b.trade||'')} · /${esc(b.slug)}</div></div><span class="pill ${b.active?'booked':''}">${b.active?'active':'off'}</span></div>
      <div class="sum">Owner: ${esc(b.owner_name||'—')} ${esc(fmtPhone(b.owner_phone))}<br>Agent line: <b>${esc(fmtPhone(b.agent_number)||'not provisioned')}</b></div>
      <div class="acts"><button class="edit" data-id="${b.id}" style="background:var(--yellow)">Edit brain</button>${b.owner_phone?`<a href="tel:${tel(b.owner_phone)}">Call owner</a>`:''}${b.agent_number?`<a href="tel:${tel(b.agent_number)}">Call agent</a>`:''}</div>
    </div>`).join('');
  $('bizs').querySelectorAll('button.edit').forEach(b=>b.onclick=()=>openBiz(b.dataset.id));
}

// ---- client brain editor ----
const DAYS=['mon','tue','wed','thu','fri','sat','sun'], URG=['emergency','urgent','standard','estimate'];
const TRADES=['plumbing','hvac','electrical','roofing','general contractor','other'];
let cur=null;
$('newBiz').onclick=async()=>{
  const name=prompt('Business name (e.g. Keystone Plumbing)'); if(!name) return;
  const owner_phone=prompt('Owner cell (10 digits)')||''; const trade=prompt('Trade: '+TRADES.join(' / '),'plumbing')||'plumbing';
  const {data,error}=await supa.rpc('hq_rx_business_create',{p:{name,owner_phone:owner_phone?'+1'+owner_phone.replace(/\D/g,'').replace(/^1/,''):null,trade}});
  if(error){ alert(error.message); return; }
  const r=await supa.rpc('hq_rx',{p_days:30}); rx=r.data; renderRx(); openBiz(data);
};
async function openBiz(id){
  const {data,error}=await supa.rpc('hq_rx_business',{p_id:id}); if(error||!data){ alert(error?error.message:'not found'); return; }
  cur=data; const b=data.business, h=b.hours||{};
  const inp=(k,label,type='text',extra='')=>`<label class="f">${label}<input data-k="${k}" type="${type}" value="${esc(b[k]??'')}" ${extra}></label>`;
  $('bizList').classList.add('hidden'); $('bizEdit').classList.remove('hidden');
  $('bizEdit').innerHTML=`<div class="ed">
    <div class="acts" style="margin:0 0 12px"><button id="back">← All clients</button><span class="tog" style="margin-left:auto"><input type="checkbox" id="active" ${b.active?'checked':''}> Line active</span></div>
    <h3>Business</h3>
    <div class="g2">${inp('name','Company name')}<label class="f">Trade<select data-k="trade">${TRADES.map(t=>`<option ${t===b.trade?'selected':''}>${t}</option>`).join('')}</select></label></div>
    <div class="g2">${inp('owner_name','Owner name')}${inp('owner_phone','Owner cell (gets the texts)','tel')}</div>
    <div class="g2">${inp('agent_name','Receptionist name (how it introduces itself)')}${inp('agent_number','Agent phone line (from provision.mjs)','tel')}</div>
    <h3>Money</h3>
    <div class="g3"><label class="f">Dispatch fee $<input data-k="service_fee_cents" type="number" value="${b.service_fee_cents!=null?b.service_fee_cents/100:''}"></label>
      <label class="f">After-hours fee $<input data-k="after_hours_fee_cents" type="number" value="${b.after_hours_fee_cents!=null?b.after_hours_fee_cents/100:''}"></label>
      <label class="f">Free estimates?<select data-k="free_estimates"><option value="true" ${b.free_estimates?'selected':''}>Yes</option><option value="false" ${!b.free_estimates?'selected':''}>No</option></select></label></div>
    <h3>Service area</h3>
    ${inp('service_zips','Zip codes (comma separated, blank = don\'t check)','text','placeholder="19460, 19464, 19380"')}
    <label class="f">Area in plain words (what it says to callers)<input data-k="service_area_note" value="${esc(b.service_area_note||'')}" placeholder="Chester and Montgomery counties, about 30 minutes from Phoenixville"></label>
    <h3>Hours &amp; arrival windows</h3>
    <div class="hrs" id="hrs">${DAYS.map(d=>`<div><span>${d}</span><input type="time" data-d="${d}" data-i="0" value="${h[d]?h[d][0]:''}" ${h[d]?'':'disabled'}><input type="time" data-d="${d}" data-i="1" value="${h[d]?h[d][1]:''}" ${h[d]?'':'disabled'}><label class="tog"><input type="checkbox" data-open="${d}" ${h[d]?'checked':''}>open</label></div>`).join('')}</div>
    <div class="g2" style="margin-top:10px"><label class="f">Arrival windows, one per line (start-end)<textarea data-k="windows" style="min-height:90px">${esc((b.windows||[]).map(w=>w[0]+'-'+w[1]).join('\n'))}</textarea></label>
      <div><label class="f">Jobs per window<input data-k="jobs_per_window" type="number" min="1" value="${b.jobs_per_window||2}"></label>
      <label class="f">Emergencies after hours<select data-k="emergency_policy">${[['after_hours_dispatch','Offer after-hours dispatch'],['message_only','Take message, tech calls back'],['transfer','Transfer live to tech']].map(([v,l])=>`<option value="${v}" ${v===b.emergency_policy?'selected':''}>${l}</option>`).join('')}</select></label>
      ${inp('transfer_number','Transfer / on-call number (if transferring)','tel')}</div></div>
    <h3>Knowledge — anything else it should know or say</h3>
    <label class="f big"><span>Plain English. Brands you service, what you don't do, promos, how to pronounce the name, warranty policy, "we don't do mobile homes", etc. Goes straight into the receptionist's brief.</span><textarea data-k="knowledge">${esc(b.knowledge||'')}</textarea></label>
    <h3>Services it can book <button id="addSvc" style="font:inherit;font-size:12px;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;background:var(--yellow);font-weight:800;cursor:pointer;margin-left:6px">+ add</button></h3>
    <div id="svcs">${data.services.map(svcRow).join('')}</div>
    <div class="bar"><button class="save" id="saveBiz">Save</button><span class="st" id="saveSt"></span><button id="testCall" style="margin-left:auto" ${b.agent_number?'':'disabled'}>Call this line</button></div>
  </div>`;
  const zipEl=$('bizEdit').querySelector('[data-k=service_zips]'); zipEl.value=(b.service_zips||[]).join(', ');
  $('back').onclick=()=>{ $('bizEdit').classList.add('hidden'); $('bizList').classList.remove('hidden'); };
  $('bizEdit').querySelectorAll('[data-open]').forEach(c=>c.onchange=()=>$('bizEdit').querySelectorAll(`[data-d=${c.dataset.open}]`).forEach(i=>{ i.disabled=!c.checked; if(c.checked&&!i.value) i.value=i.dataset.i==='0'?'07:00':'17:00'; }));
  $('saveBiz').onclick=saveBiz;
  $('addSvc').onclick=()=>{ $('svcs').insertAdjacentHTML('afterbegin',svcRow({id:'',name:'',keywords:[],urgency:'standard',fee_cents:null,safety_steps:'',active:true},true)); wireSvcs(); };
  $('testCall').onclick=()=>location.href='tel:'+tel(b.agent_number);
  wireSvcs();
}
function svcRow(s,open){
  return `<div class="svc ${s.active?'':'off'} ${open?'open':''}" data-id="${s.id||''}">
    <div class="h"><span>${esc(s.name||'New service')} <span class="pill ${esc(s.urgency)}">${esc(s.urgency)}</span></span><span>${s.fee_cents!=null?'$'+(s.fee_cents/100):''} ▾</span></div>
    <div class="body">
      <div class="g2"><label class="f">Name<input data-s="name" value="${esc(s.name||'')}" placeholder="Water heater leak"></label>
        <label class="f">Urgency<select data-s="urgency">${URG.map(u=>`<option ${u===s.urgency?'selected':''}>${u}</option>`).join('')}</select></label></div>
      <label class="f">Words callers use (comma separated)<input data-s="keywords" value="${esc((s.keywords||[]).join(', '))}" placeholder="water heater, no hot water, tank leaking"></label>
      <div class="g2"><label class="f">Fee override $ (blank = business fee)<input data-s="fee_cents" type="number" value="${s.fee_cents!=null?s.fee_cents/100:''}"></label>
        <label class="f">Bookable?<select data-s="active"><option value="true" ${s.active?'selected':''}>Yes</option><option value="false" ${!s.active?'selected':''}>Off</option></select></label></div>
      <label class="f">Safety steps it tells the caller first<textarea data-s="safety_steps" style="min-height:70px">${esc(s.safety_steps||'')}</textarea></label>
      <div class="acts"><button class="saveSvc">Save service</button><span class="st"></span></div>
    </div></div>`;
}
function wireSvcs(){
  $('svcs').querySelectorAll('.svc').forEach(el=>{
    el.querySelector('.h').onclick=()=>el.classList.toggle('open');
    el.querySelector('.saveSvc').onclick=async()=>{
      const g=k=>el.querySelector(`[data-s=${k}]`).value;
      const p={id:el.dataset.id||null,name:g('name'),urgency:g('urgency'),keywords:g('keywords').split(',').map(x=>x.trim()).filter(Boolean),fee_cents:g('fee_cents')===''?null:Math.round(+g('fee_cents')*100),safety_steps:g('safety_steps'),active:g('active')==='true'};
      if(!p.name){ alert('Name it first.'); return; }
      const {data,error}=await supa.rpc('hq_rx_service_save',{p_business:cur.business.id,p});
      if(error){ alert(error.message); return; }
      el.dataset.id=data; el.classList.toggle('off',!p.active); el.querySelector('.h span').innerHTML=esc(p.name)+' <span class="pill '+esc(p.urgency)+'">'+esc(p.urgency)+'</span>';
      const st=el.querySelector('.st'); st.textContent='Saved'; setTimeout(()=>st.textContent='',1500);
    };
  });
}
async function saveBiz(){
  const root=$('bizEdit'), g=k=>root.querySelector(`[data-k=${k}]`).value;
  const hours={}; DAYS.forEach(d=>{ const on=root.querySelector(`[data-open=${d}]`).checked; hours[d]=on?[root.querySelector(`[data-d=${d}][data-i="0"]`).value,root.querySelector(`[data-d=${d}][data-i="1"]`).value]:null; });
  const windows=g('windows').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.split(/\s*[-–]\s*/)).filter(w=>w.length===2);
  const p={name:g('name'),trade:g('trade'),owner_name:g('owner_name'),owner_phone:g('owner_phone'),agent_name:g('agent_name'),agent_number:g('agent_number'),
    service_fee_cents:g('service_fee_cents')===''?null:Math.round(+g('service_fee_cents')*100),after_hours_fee_cents:g('after_hours_fee_cents')===''?null:Math.round(+g('after_hours_fee_cents')*100),
    free_estimates:g('free_estimates')==='true',service_zips:g('service_zips').split(',').map(x=>x.trim()).filter(Boolean),service_area_note:g('service_area_note'),
    hours,windows,jobs_per_window:+g('jobs_per_window')||2,emergency_policy:g('emergency_policy'),transfer_number:g('transfer_number'),knowledge:g('knowledge'),active:$('active').checked};
  const {error}=await supa.rpc('hq_rx_business_save',{p_id:cur.business.id,p});
  if(error){ alert(error.message); return; }
  $('saveSt').textContent='Saved — live on the next call'; setTimeout(()=>$('saveSt').textContent='',2500);
  const r=await supa.rpc('hq_rx',{p_days:30}); rx=r.data; renderRx();
}
</script>
</body>
</html>
