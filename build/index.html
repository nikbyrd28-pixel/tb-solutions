<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Build your shop — The Barber Loop</title>
<meta name="description" content="Build your barbershop's website by playing. Four rounds, about ninety seconds, and it's live." />
<meta name="theme-color" content="#07080c" />
<link rel="preconnect" href="https://qgbjiqdwzgkjkmqyjsmc.supabase.co" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307080c'/%3E%3Cg stroke-linecap='round' stroke-width='7' fill='none'%3E%3Cpath d='M10 36 L34 12' stroke='%236f9dff'/%3E%3Cpath d='M18 48 L48 18' stroke='%235df2e0'/%3E%3C/g%3E%3C/svg%3E" />
<style>
  /* ═══ BUILD YOUR SHOP ═══════════════════════════════════════════════════
     A barber will not fill in a settings form between cuts, but he will play
     something for ninety seconds. So the form IS the game: four rounds, each
     one tap-sized, and his real website assembles beside him as he plays.
     Nothing here is a mock-up — every tap writes the same `site` blob the
     editor writes, and at the end the shop is genuinely live.
     ═══════════════════════════════════════════════════════════════════════ */
  :root{--bg:#07080c;--panel:rgba(255,255,255,.05);--line:rgba(150,190,255,.16);
        --ink:#f0f2f8;--muted:#9aa3ba;--acc:#5df2e0;--acc2:#6f9dff;--gold:#f0b100}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;overflow-x:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif}
  button{font:inherit;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  .hide{display:none !important}

  /* ── HUD: progress + clock. The clock is a target, never a fail state —
       a barber who runs over must still end up with a website. ─────────── */
  .hud{position:sticky;top:0;z-index:20;background:rgba(7,8,12,.9);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);padding:10px 0}
  .hud .in{max-width:560px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px}
  .pips{display:flex;gap:5px;flex:1}
  .pip{height:5px;flex:1;border-radius:3px;background:rgba(255,255,255,.12)}
  .pip.on{background:linear-gradient(90deg,var(--acc),var(--acc2))}
  .clock{font-weight:900;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .clock.good{color:var(--acc)}

  header{padding:22px 0 6px;text-align:center}
  .eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
  h1{font-size:clamp(23px,6vw,31px);line-height:1.12;margin:8px 0 6px;font-weight:900;letter-spacing:-.5px}
  .sub{color:var(--muted);font-size:15px;margin:0}

  .stage{padding:14px 0 4px}
  .q{font-size:19px;font-weight:900;margin:0 0 3px}
  .qs{color:var(--muted);font-size:13.5px;margin:0 0 14px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pick{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px 13px;
    color:var(--ink);text-align:left;transition:transform .12s,border-color .12s}
  .pick:active{transform:scale(.97)}
  .pick.on{border-color:var(--acc);background:rgba(93,242,224,.1)}
  .pick b{display:block;font-size:15.5px}
  .pick span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .sw{display:flex;gap:6px;margin-top:9px}
  .sw i{width:15px;height:15px;border-radius:4px;display:block}

  .inp{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);
    border-radius:13px;padding:14px 15px;font-size:16.5px;font-weight:700}
  .inp::placeholder{color:#6b7488;font-weight:400}

  .row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:13px;padding:11px 13px;margin-bottom:8px}
  .row b{flex:1;font-size:15px}
  .row .money{width:86px;text-align:right}
  .chip{border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:800}
  .chip.on{background:var(--acc);color:#05060d;border-color:transparent}
  .chips{display:flex;flex-wrap:wrap;gap:7px}

  .btn{display:block;width:100%;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));
    color:#05060d;font-weight:900;font-size:16.5px;border-radius:14px;padding:16px;margin-top:16px}
  .btn[disabled]{opacity:.45}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:800;font-size:15px;padding:13px}

  /* ── the live build: his site assembling as he plays ─────────────────── */
  .live{margin:16px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
  .live h3{margin:0 0 3px;font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .live .cnt{font-size:12.5px;color:var(--acc);font-weight:800;margin-bottom:9px}
  .mini{border-radius:13px;overflow:hidden;border:1px solid var(--line);background:#0d1017}
  .mini .top{height:74px;position:relative;display:flex;align-items:flex-end;padding:11px 13px}
  .mini .top .nm{font-weight:900;font-size:16px;position:relative;z-index:1}
  .mini .bars{padding:11px 13px;display:grid;gap:7px}
  .bar{height:11px;border-radius:5px;background:rgba(255,255,255,.09)}
  .bar.fill{background:linear-gradient(90deg,rgba(93,242,224,.55),rgba(111,157,255,.3))}
  .bar.s{width:62%} .bar.m{width:84%}
  .pop{animation:pop .34s ease}
  @keyframes pop{0%{transform:scale(.94);opacity:.3}100%{transform:scale(1);opacity:1}}

  .done{text-align:center;padding:8px 0 0}
  .done .big{font-size:27px;font-weight:900;color:var(--acc);margin:6px 0 4px}
  .done .lede{color:var(--muted);font-size:14.5px;margin:0 0 6px}
  .wheelwrap{position:relative;width:210px;height:210px;margin:14px auto 0}
  .wheel{width:100%;height:100%;border-radius:50%;border:6px solid rgba(255,255,255,.1);
    transition:transform 4.2s cubic-bezier(.17,.67,.16,1)}
  .pin{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;
    border-left:11px solid transparent;border-right:11px solid transparent;border-top:19px solid var(--gold)}
  .scarce{text-align:center;font-size:13px;color:var(--gold);font-weight:800;margin-top:11px}
  .err{color:#ff8b8b;font-size:14px;text-align:center;margin-top:10px}
  .codebox{background:rgba(255,255,255,.06);border:1px dashed var(--line);border-radius:13px;
    padding:14px;margin-top:14px;text-align:left}
  .codebox b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .codebox .v{font-size:20px;font-weight:900;font-family:ui-monospace,monospace;margin-top:3px}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:26px 0 44px}
  footer a{color:var(--muted)}
  @media(prefers-reduced-motion:reduce){ .wheel{transition:none} .pop{animation:none} }
</style>
</head>
<body>

<div class="hud"><div class="in">
  <div class="pips" id="pips"></div>
  <div class="clock" id="clock">0:00</div>
</div></div>

<div class="wrap">
  <header id="head">
    <div class="eyebrow">The Barber Loop</div>
    <h1 id="hTitle">Build your shop's website. By playing.</h1>
    <p class="sub" id="hSub">Four rounds, about ninety seconds. It's live at the end — and every shop that finishes wins something.</p>
  </header>

  <div class="stage" id="stage"></div>

  <div class="live hide" id="live">
    <h3>Your site, building</h3>
    <div class="cnt" id="liveCnt">0 of 4 done</div>
    <div class="mini">
      <div class="top" id="mTop"><div class="nm" id="mName">Your shop</div></div>
      <div class="bars" id="mBars">
        <div class="bar s"></div><div class="bar m"></div><div class="bar s"></div>
      </div>
    </div>
  </div>

  <footer>
    💈 <b>The Barber Loop</b> · Free for the first 10 shops in Chester County
    <div style="margin-top:6px"><a href="/barbers/">What's inside</a></div>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var SUPA='https://qgbjiqdwzgkjkmqyjsmc.supabase.co';
  var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnYmppcWR3emdramttcXlqc21jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNzc1NTEsImV4cCI6MjA5OTk1MzU1MX0.Naocw-B0B6Z7CLg197yxLezd58a6f5XoMLEiea5b0Ro';
  function el(i){ return document.getElementById(i); }
  function rpc(fn,body){
    return fetch(SUPA+'/rest/v1/rpc/'+fn,{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify(body||{})}).then(function(r){
        return r.json().catch(function(){ return null; });
      }).catch(function(){ return null; });
  }
  function esc(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  /* what the game is actually collecting — the same shape the editor saves */
  var G={ name:'', theme:'fade', accent:'', services:[], hours:{}, walkins:'', pin:'' };
  var STEP=0, TOTAL=4, t0=null, tick=null;

  var THEMES=[
    {k:'fade',   n:'Fade',    d:'Dark, modern',   c:['#0c0e13','#5df2e0','#6f9dff']},
    {k:'classic',n:'Classic', d:'Warm, old-school',c:['#f6f1e7','#8c1d1d','#17161a']},
    {k:'luxe',   n:'Luxe',    d:'Black and gold', c:['#0a0a0a','#d4af37','#f4efe4']},
    {k:'bold',   n:'Bold',    d:'Clean, bright',  c:['#ffffff','#e11d48','#101114']}
  ];
  var THEME_TOP={fade:'linear-gradient(135deg,#05070f,#11141b)',
                 classic:'linear-gradient(135deg,#17161a,#2a2723)',
                 luxe:'linear-gradient(135deg,#000,#1a1710)',
                 bold:'linear-gradient(135deg,#101114,#2b2d33)'};
  var CUTS=[['Haircut',30,'$30'],['Skin fade',40,'$35'],['Beard trim',20,'$20'],
            ['Line-up',15,'$15'],['Kids cut',25,'$22'],['Hot towel shave',35,'$40']];
  var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var DAYKEY={Mon:'1',Tue:'2',Wed:'3',Thu:'4',Fri:'5',Sat:'6',Sun:'0'};

  function pips(){
    var h='';
    for(var i=0;i<TOTAL;i++) h+='<div class="pip'+(i<STEP?' on':'')+'"></div>';
    el('pips').innerHTML=h;
  }
  function startClock(){
    if(tick) return;
    t0=Date.now();
    tick=setInterval(function(){
      var s=Math.floor((Date.now()-t0)/1000);
      el('clock').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
      el('clock').classList.toggle('good', s<=90);
    },250);
  }
  function stopClock(){ if(tick){ clearInterval(tick); tick=null; } return Math.floor((Date.now()-t0)/1000); }

  function paintLive(){
    el('live').classList.remove('hide');
    el('liveCnt').textContent=STEP+' of '+TOTAL+' done';
    el('mName').textContent=G.name||'Your shop';
    el('mTop').style.background=THEME_TOP[G.theme]||THEME_TOP.fade;
    var bars='';
    // one filled bar per thing he has actually given us — the site visibly
    // gains a section per round, which is the whole dopamine of this thing
    var have=[!!G.name, G.services.length>0, Object.keys(G.hours).length>0, !!G.walkins];
    for(var i=0;i<4;i++){
      bars+='<div class="bar '+(i%2?'m':'s')+(have[i]?' fill pop':'')+'"></div>';
    }
    el('mBars').innerHTML=bars;
  }

  /* ── round 1: the name ────────────────────────────────────────────── */
  function r1(){
    el('stage').innerHTML=
      '<p class="q">Round 1 — what\'s the shop called?</p>'+
      '<p class="qs">This is the name your customers will see at the top.</p>'+
      '<input class="inp" id="nm" placeholder="e.g. Maple Street Barbers" maxlength="40" autocomplete="organization">'+
      '<button class="btn" id="go" disabled>Next →</button>';
    var i=el('nm'), b=el('go');
    i.addEventListener('input',function(){
      G.name=this.value.trim(); b.disabled=G.name.length<2; paintLive(); startClock();
    });
    i.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!b.disabled) b.click(); });
    b.addEventListener('click',function(){ STEP=1; pips(); r2(); });
    setTimeout(function(){ i.focus(); },80);
    paintLive();
  }

  /* ── round 2: the look ────────────────────────────────────────────── */
  function r2(){
    el('stage').innerHTML=
      '<p class="q">Round 2 — pick your look</p>'+
      '<p class="qs">Tap one. You can change it later from your phone.</p>'+
      '<div class="grid2" id="th"></div>'+
      '<button class="btn" id="go">Next →</button>';
    el('th').innerHTML=THEMES.map(function(t){
      return '<button class="pick'+(G.theme===t.k?' on':'')+'" data-k="'+t.k+'">'+
        '<b>'+esc(t.n)+'</b><span>'+esc(t.d)+'</span>'+
        '<span class="sw">'+t.c.map(function(c){ return '<i style="background:'+c+'"></i>'; }).join('')+'</span>'+
      '</button>';
    }).join('');
    el('th').addEventListener('click',function(e){
      var b=e.target.closest('.pick'); if(!b) return;
      G.theme=b.getAttribute('data-k');
      [].forEach.call(this.querySelectorAll('.pick'),function(x){ x.classList.toggle('on',x===b); });
      paintLive();
    });
    el('go').addEventListener('click',function(){ STEP=2; pips(); r3(); });
    paintLive();
  }

  /* ── round 3: the menu ────────────────────────────────────────────── */
  function r3(){
    el('stage').innerHTML=
      '<p class="q">Round 3 — what do you charge?</p>'+
      '<p class="qs">Tap the ones you do. Change any price that isn\'t yours.</p>'+
      '<div id="cuts"></div>'+
      '<button class="btn" id="go" disabled>Next →</button>';
    el('cuts').innerHTML=CUTS.map(function(c,i){
      return '<div class="row"><button class="chip" data-i="'+i+'">Add</button>'+
        '<b>'+esc(c[0])+'</b>'+
        '<input class="inp money" data-p="'+i+'" value="'+esc(c[2])+'" maxlength="7" inputmode="text"></div>';
    }).join('');
    function sync(){
      G.services=[];
      [].forEach.call(el('cuts').querySelectorAll('.chip.on'),function(ch){
        var i=+ch.getAttribute('data-i');
        var pr=el('cuts').querySelector('[data-p="'+i+'"]').value.trim();
        G.services.push({id:'s'+i,name:CUTS[i][0],mins:CUTS[i][1],price:pr});
      });
      el('go').disabled=G.services.length===0;
      paintLive();
    }
    el('cuts').addEventListener('click',function(e){
      var ch=e.target.closest('.chip'); if(!ch) return;
      ch.classList.toggle('on'); ch.textContent=ch.classList.contains('on')?'✓ On':'Add';
      sync();
    });
    el('cuts').addEventListener('input',sync);
    // the two nearly every shop does, pre-armed so round 3 can be one tap
    [0,1].forEach(function(i){
      var ch=el('cuts').querySelector('.chip[data-i="'+i+'"]');
      ch.classList.add('on'); ch.textContent='✓ On';
    });
    sync();
    el('go').addEventListener('click',function(){ STEP=3; pips(); r4(); });
  }

  /* ── round 4: the week ────────────────────────────────────────────── */
  function r4(){
    el('stage').innerHTML=
      '<p class="q">Round 4 — when are you open?</p>'+
      '<p class="qs">Tap the days you cut. Then say how walk-ins work.</p>'+
      '<div class="chips" id="days"></div>'+
      '<p class="qs" style="margin:16px 0 8px">Walk-ins?</p>'+
      '<div class="chips" id="wk">'+
        '<button class="chip" data-w="welcome">Walk-ins welcome</button>'+
        '<button class="chip" data-w="call">Call ahead</button>'+
        '<button class="chip" data-w="appointment">By appointment</button>'+
      '</div>'+
      '<button class="btn" id="go" disabled>Finish and go live →</button>'+
      '<div class="err hide" id="err"></div>';
    el('days').innerHTML=DAYS.map(function(d){
      return '<button class="chip" data-d="'+d+'">'+d+'</button>';
    }).join('');
    function sync(){
      G.hours={};
      [].forEach.call(el('days').querySelectorAll('.chip.on'),function(c){
        G.hours[DAYKEY[c.getAttribute('data-d')]]=['09:00','18:00'];
      });
      el('go').disabled=!(Object.keys(G.hours).length && G.walkins);
      paintLive();
    }
    el('days').addEventListener('click',function(e){
      var c=e.target.closest('.chip'); if(!c) return; c.classList.toggle('on'); sync();
    });
    el('wk').addEventListener('click',function(e){
      var c=e.target.closest('.chip'); if(!c) return;
      G.walkins=c.getAttribute('data-w');
      [].forEach.call(this.querySelectorAll('.chip'),function(x){ x.classList.toggle('on',x===c); });
      sync();
    });
    // Tue–Sat is the normal barbershop week; pre-armed, still his to change
    ['Tue','Wed','Thu','Fri','Sat'].forEach(function(d){
      var c=el('days').querySelector('[data-d="'+d+'"]'); c.classList.add('on');
    });
    sync();
    el('go').addEventListener('click',finish);
  }

  /* ── finish: create the shop for real, then the prize ─────────────── */
  function finish(){
    var b=el('go'); b.disabled=true; b.textContent='Building your site…';
    var secs=stopClock();
    STEP=4; pips(); paintLive();

    // a PIN he did not choose is a PIN he will not remember, so it is shown
    // to him plainly at the end rather than emailed to nobody
    var pin=String(Math.floor(1000+Math.random()*9000));
    G.pin=pin;

    rpc('create_loop_shop',{p_name:G.name,p_pin:pin,p_email:null,p_kind:'shop',p_ref:null})
    .then(function(r){
      if(!r || r.ok===false || !r.slug){
        b.disabled=false; b.textContent='Finish and go live →';
        el('err').textContent=(r&&r.error)||'Could not create the shop — try again.';
        el('err').classList.remove('hide');
        return null;
      }
      var slug=r.slug;
      var site={on:true,theme:G.theme,cta:'book',accent:'',tagline:'',about:'',
        address:'',phone:'',ig:'',tiktok:'',maps:'',hero:'',logo:'',photos:[],buttons:[],
        team:true,prices:true,reviews:true,sms:true,walkins:G.walkins,pay:[],
        parking:'',policy:'',gift:'',barbers:[],tracks:[]};
      return rpc('shop_site_set',{p_client:slug,p_pin:pin,p_site:site})
        .then(function(){
          // full named signature so PostgREST picks exactly one overload.
          // deposit_note is NOT coalesced server-side, so the default is
          // passed back deliberately rather than blanking what setup wrote.
          return rpc('save_booking_config',{p_client:slug,p_pin:pin,
            p_services:G.services,p_staff:[],p_hours:G.hours,
            p_slot_every:15,p_lead_mins:90,p_horizon_days:30,
            p_book_tz:'America/New_York',
            p_deposit_note:'Free to book — please give 24h notice to cancel.',
            p_booking_on:true});
        })
        .then(function(){ return rpc('claim_spin',{p_client:slug}); })
        .then(function(sp){ live(slug,pin,secs,sp); });
    });
  }

  function live(slug,pin,secs,sp){
    el('head').classList.add('hide');
    el('live').classList.add('hide');
    var fast = secs>0 && secs<=90;
    el('stage').innerHTML=
      '<div class="done">'+
        '<div class="lede">'+(fast?'Built in '+secs+' seconds.':'Built and live.')+'</div>'+
        '<div class="big">'+esc(G.name)+' is online</div>'+
        '<p class="lede">Real site, real booking page, real rewards card. Nothing to pay.</p>'+
        '<div class="codebox"><b>Your shop code</b><div class="v">'+esc(slug)+'</div></div>'+
        '<div class="codebox"><b>Your staff PIN — write this down</b><div class="v">'+esc(pin)+'</div></div>'+
        (sp&&sp.ok?'<p class="lede" style="margin-top:16px">And your spin…</p>'+
          '<div class="wheelwrap"><div class="pin"></div><div class="wheel" id="wheel"></div></div>'+
          '<div class="scarce hide" id="prize"></div>':'')+
        '<button class="btn" id="see">See my site →</button>'+
        '<button class="btn ghost" id="edit">Add photos and my barbers</button>'+
      '</div>';
    el('see').addEventListener('click',function(){
      window.open('/shop/?c='+encodeURIComponent(slug),'_blank','noopener');
    });
    el('edit').addEventListener('click',function(){
      location.href='/shop/edit/?c='+encodeURIComponent(slug);
    });
    if(sp&&sp.ok) spin(sp);
  }

  /* The wedges are decoration. The prize was decided by claim_spin() on the
     server — a wheel that picks its own winner in JavaScript is one devtools
     console away from every shop winning Loop for life. */
  var SEG=['month','quarter','lifetime','month','year','quarter','month','year'];
  function spin(sp){
    var w=el('wheel'); if(!w) return;
    var step=360/SEG.length, stops=[];
    for(var i=0;i<SEG.length;i++){
      var c = SEG[i]==='lifetime' ? '#f0b100'
            : SEG[i]==='year'     ? 'rgba(93,242,224,.55)'
            : SEG[i]==='quarter'  ? 'rgba(111,157,255,.45)'
                                  : 'rgba(255,255,255,.07)';
      stops.push(c+' '+(i*step)+'deg '+((i+1)*step)+'deg');
    }
    w.style.background='conic-gradient('+stops.join(',')+')';
    var idx=SEG.indexOf(sp.prize); if(idx<0) idx=0;
    setTimeout(function(){
      w.style.transform='rotate('+((360*5)+(360-(idx*step+step/2)))+'deg)';
    },250);
    setTimeout(function(){
